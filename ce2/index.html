      '<button class="coin-case" data-c="tracer"><b>✏️</b><span>J\'écris</span></button>' +
      '<button class="coin-case" data-c="colorier"><b>🎨</b><span>Coloriage</span></button></div>';
    dire("Mon coin. Que veux-tu faire ?");
    document.getElementById("retour").onclick = carte;
    $ecran.querySelectorAll(".coin-case").forEach(b => b.onclick = () => ({ animal: animal, comptines: comptines, tracer: () => tracer(0), colorier: () => colorier(0) })[b.dataset.c]());
  }

  function animal(message) {
    changer();
    $ecran.className = "ecran";
    if (!E.animal) {
      $ecran.innerHTML = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>Choisis ton animal</h1></div><div class="coin-grille">' +
        Object.entries(ANIMAUX_COMPAGNONS).map(([k, [e, nom]]) => '<button class="coin-case" data-a="' + k + '"><b>' + e + "</b><span>" + nom + "</span></button>").join("") + "</div>";
      dire("Choisis ton animal. Tu vas t'en occuper !");
      document.getElementById("retour").onclick = coin;
      $ecran.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { E.animal = { type: b.dataset.a, faim: 60, proprete: 60, joie: 60, soins: 0, jour: aujourdhui() }; sauver(); son("gagne"); animal("Voici " + ANIMAUX_COMPAGNONS[b.dataset.a][1] + " !"); });
      return;
    }
    const a = E.animal;
    // Un peu de faim chaque nouveau jour, sans jamais de punition.
    if (a.jour !== aujourdhui()) { a.faim = Math.max(20, a.faim - 25); a.proprete = Math.max(20, a.proprete - 20); a.joie = Math.max(20, a.joie - 20); a.jour = aujourdhui(); sauver(); }
    const [e, nom] = ANIMAUX_COMPAGNONS[a.type];
    const taille = Math.min(5, 1 + Math.floor(a.soins / 8));
    const humeur = Math.min(a.faim, a.proprete, a.joie);
    const phrase = message || (humeur < 40 ? nom + (a.faim < 40 ? " a faim !" : a.proprete < 40 ? " voudrait un bain !" : " veut jouer avec toi !") : nom + " est content de te voir !");
    const jauge = (lab, v) => '<div class="jauge-animal"><span>' + lab + '</span><span class="jauge"><i style="width:' + v + '%"></i></span></div>';
    $ecran.innerHTML = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>' + esc(nom) + '</h1><span style="flex:1"></span><span class="pastille">Taille ' + taille + "/5</span></div>" +
      '<div class="maison-animal"><span class="compagnon" id="compagnon" style="font-size:' + (60 + taille * 14) + 'px">' + e + '</span><p class="bulle-animal">' + esc(phrase) + "</p></div>" +
      jauge("🍎 Ventre", a.faim) + jauge("🫧 Propre", a.proprete) + jauge("💛 Joie", a.joie) +
      '<div class="actions-animal">' + [["manger", "🍎", "Nourrir"], ["laver", "🧼", "Laver"], ["jouer", "⚽", "Jouer"]].map(([k, ic, lab]) => '<button class="objet" data-act="' + k + '"' + ((E.jetons[k] || 0) ? "" : " disabled") + "><b>" + ic + "</b><span>" + lab + '</span><span class="prix">× ' + (E.jetons[k] || 0) + "</span></button>").join("") + "</div>" +
      '<p class="aide">Gagne des 🍎 🧼 ⚽ en jouant sur la carte et avec la question du jour.</p>';
    dire(phrase);
    document.getElementById("retour").onclick = coin;
    $ecran.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
      const k = b.dataset.act; if (!E.jetons[k]) return;
      E.jetons[k]--; a.soins++;
      if (k === "manger") a.faim = Math.min(100, a.faim + 30); if (k === "laver") a.proprete = Math.min(100, a.proprete + 30); if (k === "jouer") a.joie = Math.min(100, a.joie + 30);
      const grandit = a.soins % 8 === 0 && a.soins / 8 < 5;
      sauver(); son(grandit ? "gagne" : "pop");
      animal(grandit ? nom + " a grandi ! Bravo !" : { manger: "Miam ! Merci !", laver: "Tout propre !", jouer: "Youpi, on s'amuse !" }[k]);
      const c = document.getElementById("compagnon"); if (c) c.classList.add("saute");
    });
  }

  function comptines() {
    changer();
    $ecran.className = "ecran";
    const liste = C.comptines || [];
    $ecran.innerHTML = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>Les comptines</h1></div><div class="bons">' +
      liste.map((c, i) => '<button class="bon-ligne" data-k="' + i + '"><b>' + c.e + "</b><span>" + esc(c.titre) + '</span><span class="prix">▶</span></button>').join("") + "</div>";
    document.getElementById("retour").onclick = coin;
    $ecran.querySelectorAll("[data-k]").forEach(b => b.onclick = () => comptine(liste[+b.dataset.k]));
  }
  function comptine(c) {
    changer();
    $ecran.className = "ecran";
    $ecran.innerHTML = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>' + esc(c.titre) + '</h1></div><div class="paroles">' +
      c.lignes.map((l, i) => '<p data-l="' + i + '"><span>' + (l[1] || "") + "</span>" + esc(l[0]) + "</p>").join("") + '</div><div class="boutons"><button class="bouton" id="chanter">▶ Chante avec moi</button></div>';
    let fini = false, timer = 0;
    arreter = () => { fini = true; clearTimeout(timer); if (parole) parole.cancel(); };
    document.getElementById("retour").onclick = comptines;
    function ligne(i) {
      if (fini) return;
      $ecran.querySelectorAll(".paroles p").forEach(p => p.classList.toggle("active", +p.dataset.l === i));
      if (i >= c.lignes.length) { if (!E.chants) E.chants = 0; E.chants++; if (E.chants % 2 === 0) { E.jetons.jouer = (E.jetons.jouer || 0) + 1; bravo("⚽ +1"); } sauver(); return; }
      const p = $ecran.querySelector('.paroles p[data-l="' + i + '"]'); if (p) p.scrollIntoView({ block: "center", behavior: "smooth" });
      const t = c.lignes[i][0];
      if (parole) { try { parole.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "fr-FR"; u.rate = 0.8; u.pitch = 1.25; if (voix) u.voice = voix; u.onend = () => { timer = setTimeout(() => ligne(i + 1), 250); }; parole.speak(u); return; } catch (e) {} }
      timer = setTimeout(() => ligne(i + 1), 1800);
    }
    document.getElementById("chanter").onclick = () => { fini = false; ligne(0); };
  }

  // Tracer une lettre avec le doigt : on vérifie qu'on a bien suivi la forme.
  function tracer(k) {
    changer();
    $ecran.className = "ecran";
    const lettres = C.lettresATracer || ["A", "E", "I", "O", "U"];
    const L = lettres[k % lettres.length];
    $ecran.innerHTML = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>J\'écris : ' + L + '</h1><span style="flex:1"></span><span class="pastille">' + (k % lettres.length + 1) + "/" + lettres.length + "</span></div>" +
      '<p class="aide">Suis la lettre avec ton doigt, sans sortir du chemin.</p><div class="ardoise"><canvas id="modele"></canvas><canvas id="trace"></canvas></div>' +
      '<div class="boutons"><button class="bouton second" id="effacer">Effacer</button><button class="bouton" id="verifier">J\'ai fini</button></div>';
    dire("Écris la lettre " + L + ". Suis le chemin avec ton doigt.");
    document.getElementById("retour").onclick = coin;
    const boite = $ecran.querySelector(".ardoise"), cm = document.getElementById("modele"), ct = document.getElementById("trace");
    const W = boite.clientWidth, Hh = Math.min(360, W);
    const dpr = window.devicePixelRatio || 1;
    [cm, ct].forEach(c => { c.width = W * dpr; c.height = Hh * dpr; c.style.width = W + "px"; c.style.height = Hh + "px"; c.getContext("2d").scale(dpr, dpr); });
    const xm = cm.getContext("2d"), xt = ct.getContext("2d");
    const dessinerModele = () => {
      xm.clearRect(0, 0, W, Hh);
      xm.font = "700 " + Math.round(Hh * 0.82) + "px Andika, sans-serif"; xm.textAlign = "center"; xm.textBaseline = "middle";
      xm.fillStyle = "#e8dcc6"; xm.fillText(L, W / 2, Hh / 2 + Hh * 0.04);
      xm.setLineDash([6, 10]); xm.lineWidth = 3; xm.strokeStyle = "#b9a98d"; xm.strokeText(L, W / 2, Hh / 2 + Hh * 0.04);
    };
    dessinerModele(); if (document.fonts) document.fonts.ready.then(dessinerModele);
    xt.lineWidth = Math.max(18, Hh * 0.08); xt.lineCap = "round"; xt.lineJoin = "round"; xt.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--theme").trim() || "#8a4fd6";
    let enCours = false;
    const pos = e => { const r = ct.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    ct.addEventListener("pointerdown", e => { enCours = true; ct.setPointerCapture(e.pointerId); const [x, y] = pos(e); xt.beginPath(); xt.moveTo(x, y); xt.lineTo(x + 0.1, y); xt.stroke(); });
    ct.addEventListener("pointermove", e => { if (!enCours) return; const [x, y] = pos(e); xt.lineTo(x, y); xt.stroke(); });
    ct.addEventListener("pointerup", () => enCours = false);
    ct.style.touchAction = "none";
    document.getElementById("effacer").onclick = () => xt.clearRect(0, 0, W, Hh);
    document.getElementById("verifier").onclick = () => {
      const a = xm.getImageData(0, 0, cm.width, cm.height).data, b = xt.getImageData(0, 0, ct.width, ct.height).data;
      let lettre = 0, couvert = 0, trait = 0, dehors = 0;
      for (let i = 0; i < a.length; i += 4 * 6) {
        const dansLettre = a[i + 3] > 40, dansTrait = b[i + 3] > 40;
        if (dansLettre) { lettre++; if (dansTrait) couvert++; }
        if (dansTrait) { trait++; if (!dansLettre) dehors++; }
      }
      const couverture = couvert / Math.max(1, lettre), ecart = dehors / Math.max(1, trait);
      if (couverture > 0.5 && ecart < 0.6) {
        son("gagne"); bravo("Bravo !"); parler("bravo", "Bravo, tu as bien écrit la lettre " + L + " !");
        if (!E.lettresTracees.includes(L)) { E.lettresTracees.push(L); E.jetons.laver = (E.jetons.laver || 0) + 1; }
        sauver();
        setTimeout(() => tracer(k + 1), 1500);
      } else { son("faux"); dire(couverture <= 0.5 ? "Continue, il manque un morceau de la lettre." : "Attention, reste bien sur le chemin."); }
    };
  }

      sauver();
    }; });
    $ecran.querySelectorAll(".pot").forEach(p => p.onclick = () => { choisie = p.dataset.c; $ecran.querySelectorAll(".pot").forEach(x => x.classList.toggle("choisi", x === p)); son("pop"); });

  function jeuOie(p) {

  function genererLabyrinthe(w, h, min) {
    let meilleur = null;
    for (let essai = 0; essai < 60; essai++) {
      const ouv = Array.from({ length: w * h }, () => new Set()), vu = new Set([0]), pile = [0];
      while (pile.length) {
        const c = pile[pile.length - 1], x = c % w, y = Math.floor(c / w);
        const v = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [x + dx, y + dy]).filter(([a, b]) => a >= 0 && b >= 0 && a < w && b < h && !vu.has(b * w + a));
        if (!v.length) { pile.pop(); continue; }
        const [a, b] = v[Math.floor(Math.random() * v.length)], n = b * w + a;
        ouv[c].add(n); ouv[n].add(c); vu.add(n); pile.push(n);
      }
      const prec = { 0: -1 }, file = [0];
      while (file.length) { const c = file.shift(); ouv[c].forEach(n => { if (!(n in prec)) { prec[n] = c; file.push(n); } }); }
      const chemin = []; for (let c = w * h - 1; c !== -1; c = prec[c]) chemin.unshift(c);
      if (!meilleur || chemin.length > meilleur.chemin.length) meilleur = { ouv, chemin };
      if (chemin.length >= min) break;
    }
    return meilleur;
  }
  function jeuLabyrinthe(p) {
    const w = 5, h = 4, N = p.questions.length;
    const { ouv, chemin } = genererLabyrinthe(w, h, N + 1);
    const arrets = Array.from({ length: N + 1 }, (_, j) => Math.round(j * (chemin.length - 1) / N));
    const portes = new Set(arrets.slice(1, -1).map(j => chemin[j]));
    const grille = () => {
      const ici = arrets[p.k], trace = new Set(chemin.slice(0, ici + 1));
      let html = '<div class="labyrinthe" style="grid-template-columns:repeat(' + (2 * w + 1) + ',1fr)">';
      for (let gy = 0; gy < 2 * h + 1; gy++) for (let gx = 0; gx < 2 * w + 1; gx++) {
        let classe = "mur", contenu = "";
        if (gx % 2 && gy % 2) {
          const c = ((gy - 1) / 2) * w + (gx - 1) / 2;
          classe = "allee" + (trace.has(c) ? " vu" : "");
          if (c === chemin[ici]) contenu = pion(); else if (c === w * h - 1) contenu = "🏁"; else if (portes.has(c)) contenu = trace.has(c) ? "" : "🚪";
        } else if (gx % 2 !== gy % 2 && gx > 0 && gy > 0 && gx < 2 * w && gy < 2 * h) {
          const a = gx % 2 ? ((gy - 2) / 2) * w + (gx - 1) / 2 : ((gy - 1) / 2) * w + (gx - 2) / 2;
          const b = gx % 2 ? a + w : a + 1;

    }

  }

  function paires() {

  function donneesSemaine() {
    const ilya7 = Date.now() - 7 * 864e5;
    const parties = E.journal.filter(j => new Date(j.date).getTime() >= ilya7);
    const min = Object.entries(E.jours).filter(([j]) => new Date(j + "T12:00").getTime() >= ilya7).reduce((s, [, v]) => s + v, 0) / 60;
    const parLecon = {};
    parties.forEach(j => { if (j.ratio == null) return; (parLecon[j.id] = parLecon[j.id] || []).push(j.ratio); });
    const tous = NIVEAUX.concat([NIVEAU_BOSS]);
    const nom = id => { const n = tous.find(x => x.id === id); return n ? n.titre : null; };
    const moy = a => a.reduce((s, x) => s + x, 0) / a.length;
    const acquis = Object.keys(parLecon).filter(id => moy(parLecon[id]) >= 0.85).map(nom).filter(Boolean);
    const coince = Object.keys(parLecon).filter(id => moy(parLecon[id]) < 0.65).map(nom).filter(Boolean);
    const compte = {}; E.erreurs.forEach(x => compte[x.id] = (compte[x.id] || 0) + 1);
    const reprendre = Object.entries(compte).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, k]) => { const n = tous.find(x => x.id === id); return n ? esc(n.titre) + (n.objectif ? " (" + esc(n.objectif) + ")" : "") + " · " + k + " erreur" + (k > 1 ? "s" : "") + " à revoir" : null; }).filter(Boolean);
    const joursJoues = Object.keys(E.jours).filter(j => new Date(j + "T12:00").getTime() >= ilya7).length;
    const points = Math.round(parties.reduce((s, j) => s + (j.ratio || 0) * 10, 0) + joursJoues * 5);
    return { parties: parties.length, min: Math.round(min), acquis, coince, reprendre, points, joursJoues };
  }

    const tous = NIVEAUX.concat([NIVEAU_BOSS]);
    const nomDe = id => { const n = tous.find(x => x.id === id); return n ? n.titre : id; };
    const etat = {
      prenom: prenom(), classe: C.classe, titre: C.titreAppli, avatar: C.avatar, couleur: getComputedStyle(document.documentElement).getPropertyValue("--theme").trim(),
      maj: Date.now(), pieces: E.pieces, serie: serieActive(), etoiles: totalEtoiles(), faites: tous.filter(n => etoilesDe(n) > 0).length, total: tous.length,
      semaine: donneesSemaine(), toutOuvert: E.toutOuvert, code: E.code === "1234" ? "1234" : "modifié",
      matieres: C.mondes.map(m => ({ titre: m.titre, icone: m.icone, lecons: NIVEAUX.filter(n => n.monde === m).map(n => ({ titre: n.titre, objectif: n.objectif || "", etoiles: etoilesDe(n), dernier: (E.progres[n.id] || {}).dernier || "" })) })),
      journal: E.journal.slice(0, 25).map(j => ({ titre: nomDe(j.id), score: j.score, date: j.date })),
      jours: E.jours, bulletins: E.bulletins.slice(0, 6), bons: E.bons.slice(0, 15), catalogue: catalogue(),
    };
    base.doc("familles/" + E.famille + "/enfants/" + C.id).set(etat).catch(() => {});
  }
  function appliquerReglages(r) {
    let change = false;
    Object.entries(r.decisions || {}).forEach(([date, dec]) => {
      const b = E.bons.find(x => x.date === date && x.statut === "attente");
      if (!b) return;
      if (dec === "accorde") { b.statut = "accorde"; b.vu = false; } else { b.statut = "refuse"; E.pieces += b.prix; }
      change = true;
    });
    (r.cadeaux || []).forEach(c => { if (E.recus.includes(c.id)) return; E.recus.push(c.id); E.pieces += c.n; change = true; setTimeout(() => { bravo("🎁 +" + c.n + " pièces de papa !"); son("piece"); }, 600); });
    if (typeof r.toutOuvert === "boolean" && r.toutOuvert !== E.toutOuvert) { E.toutOuvert = r.toutOuvert; change = true; }
    if (r.prenom && r.prenom !== E.prenom) { E.prenom = r.prenom; change = true; }
    if (Array.isArray(r.catalogue) && JSON.stringify(r.catalogue) !== JSON.stringify(E.catalogue)) { E.catalogue = r.catalogue; change = true; }
    if (change) { sauver(); if (document.getElementById("voyage")) carte(); }
  }
  async function honneur() {
    changer();
    $ecran.className = "ecran";
    $ecran.innerHTML = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>Tableau d\'honneur</h1></div><p class="aide">Chargement…</p>';
    document.getElementById("retour").onclick = carte;
    let enfants = [];
    try { const q = await base.collection("familles/" + E.famille + "/enfants").get(); enfants = q.docs.map(d => d.data()); } catch (e) {}
    if (!enfants.length) { $ecran.querySelector(".aide").textContent = "Pas de connexion pour l'instant. Réessaie avec internet."; return; }
    enfants.sort((a, b) => (b.semaine ? b.semaine.points : 0) - (a.semaine ? a.semaine.points : 0));
    const medailles = ["🥇", "🥈", "🥉"];
    $ecran.innerHTML = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>Tableau d\'honneur</h1></div>' +
      '<p class="aide">Les points de la semaine : 10 par partie parfaite et 5 par jour joué. Chacun joue à son niveau, donc c\'est juste !</p><div class="bons">' +
      enfants.map((x, i) => '<div class="bon-ligne demande' + (x.prenom === prenom() ? " moi-h" : "") + '"><b>' + (medailles[i] || "⭐") + '</b><span><strong>' + esc(x.prenom) + "</strong> · " + esc(x.classe) + "<br><small>" + (x.semaine ? x.semaine.parties : 0) + " parties · 🔥 " + (x.serie || 0) + '</small></span><span class="prix">' + (x.semaine ? x.semaine.points : 0) + " pts</span></div>").join("") + "</div>";
    document.getElementById("retour").onclick = carte;
    dire(enfants[0].prenom + " est en tête cette semaine !");
  }

  window.addEventListener("resize", () => { if (document.getElementById("voyage")) carte(); });
  appliquerAffichage();
  carte();
  demarrerSync();
})();
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
