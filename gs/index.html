<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="École GS">
<title>Mon école GS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#8a4fd6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Mise en page : un jeu d'une seule colonne. La carte du voyage défile, chaque niveau ouvre un mini-jeu plein écran. */
:root {
  --sable: #fff6e6;
  --carte: #ffffff;
  --encre: #2b2118;
  --doux: #7a6a58;
  --theme: #8a4fd6;
  --theme-clair: #eadcfb;
  --mangue: #ffb21e;
  --vert: #2e9e5b;
  --rouge: #e0533d;
  --trait: #ecdcc2;
  --mer: #8fd3f0;
  --mer-fonce: #3a9fd6;
  --savane: #f6dc8c;
  --fleuve: #a9e0c8;
  --foret: #8fcf8a;
  --titre: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --lecture: "Andika", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sable); color: var(--encre); font-family: var(--lecture); font-size: 18px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overscroll-behavior: none; overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sable); }
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.ecran { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 16px; box-sizing: border-box; }
.ecran.sans-marge { padding: 0; gap: 0; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--theme); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--titre); margin: 0; line-height: 1.1; text-wrap: balance; }

/* Barre du haut */
.barre { display: flex; align-items: center; gap: 8px; }
.barre .espace { flex: 1; }
.rond { width: 46px; height: 46px; border-radius: 50%; background: var(--carte); display: grid; place-items: center; font-size: 22px; box-shadow: 0 3px 0 var(--trait); flex: none; }
.pastille { display: flex; align-items: center; gap: 4px; background: var(--carte); border-radius: 999px; padding: 4px 11px; font-family: var(--titre); font-weight: 800; font-size: 17px; box-shadow: 0 3px 0 var(--trait); font-variant-numeric: tabular-nums; white-space: nowrap; }
.perso { position: relative; width: 52px; height: 52px; border-radius: 16px; background: var(--theme); display: grid; place-items: center; font-size: 30px; flex: none; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.perso .accessoire { position: absolute; top: -12px; right: -10px; font-size: 24px; transform: rotate(14deg); }
.perso.grand { width: 96px; height: 96px; border-radius: 28px; font-size: 58px; }
.perso.grand .accessoire { font-size: 42px; top: -22px; right: -18px; }

/* Carte du voyage */
.carte-haut { position: sticky; top: 0; z-index: 3; display: grid; gap: 8px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(var(--sable) 75%, rgba(255,246,230,0)); }
.salut { font-family: var(--titre); font-weight: 800; font-size: 22px; line-height: 1.1; }
.salut small { display: block; font-family: var(--lecture); font-weight: 400; font-size: 14px; color: var(--doux); }
.voyage { position: relative; padding: 10px 0 40px; }
.voyage svg.route { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.zone { position: relative; }
.zone-nom { position: relative; z-index: 1; text-align: center; font-family: var(--titre); font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: rgba(43,33,24,.55); padding: 14px 0 0; }
.etape { position: relative; z-index: 2; height: 118px; }
.noeud { position: absolute; top: 14px; transform: translateX(-50%); display: grid; justify-items: center; gap: 2px; width: 120px; }
.noeud .bulle { width: 70px; height: 70px; border-radius: 50%; background: var(--carte); display: grid; place-items: center; font-size: 32px; box-shadow: 0 5px 0 rgba(0,0,0,.18); border: 4px solid var(--theme); font-family: var(--lecture); font-weight: 700; }
.noeud.fini .bulle { background: var(--theme); color: #fff; border-color: #fff; }
.noeud.ferme .bulle { background: #e9e2d6; border-color: #d4c9b6; filter: grayscale(1); opacity: .8; }
.noeud.actuel .bulle { animation: battre 1.4s infinite; }
.noeud.boss .bulle { width: 88px; height: 88px; font-size: 46px; border-color: var(--rouge); }
.noeud .lieu { font-family: var(--titre); font-weight: 800; font-size: 15px; background: rgba(255,255,255,.85); border-radius: 999px; padding: 0 10px; white-space: nowrap; }
.noeud .etoiles { font-size: 14px; letter-spacing: 1px; line-height: 1; }
.noeud .moi { position: absolute; left: -26px; top: -10px; }
@keyframes battre { 50% { transform: scale(1.08); } }
.etoiles .on { color: var(--mangue); }
.etoiles .off { color: rgba(0,0,0,.18); }

/* Fenêtre */
.voile { position: fixed; inset: 0; z-index: 20; background: rgba(43,33,24,.45); display: grid; place-items: end center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.fenetre { width: 100%; max-width: 520px; background: var(--sable); border-radius: 28px; padding: 20px; display: grid; gap: 12px; justify-items: center; text-align: center; animation: monter .25s ease-out; }
.fenetre .grosse-icone { font-size: 64px; line-height: 1; }
.fenetre h2 { font-size: 30px; font-weight: 800; }
.fenetre p { margin: 0; color: var(--doux); }
@keyframes monter { from { transform: translateY(40px); opacity: 0; } }

.bouton { background: var(--theme); color: #fff; font-family: var(--titre); font-weight: 800; font-size: 24px; border-radius: 18px; padding: 12px 28px; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
.bouton.second { background: var(--carte); color: var(--encre); box-shadow: 0 5px 0 var(--trait); }
.bouton:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.boutons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

/* Jeux : en-tête commun */
.jeu { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.jeu-haut { display: grid; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.progression { flex: 1; height: 14px; border-radius: 99px; background: var(--carte); overflow: hidden; box-shadow: inset 0 0 0 2px var(--trait); }
.progression i { display: block; height: 100%; background: var(--theme); border-radius: 99px; transition: width .3s; }
.consigne { display: flex; align-items: center; gap: 10px; }
.consigne p { margin: 0; font-size: 21px; font-weight: 700; flex: 1; line-height: 1.25; }
.haut-parleur { width: 54px; height: 54px; border-radius: 50%; background: var(--theme); color: #fff; font-size: 24px; flex: none; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.scene { background: var(--carte); border-radius: 20px; padding: 10px 14px; box-shadow: 0 3px 0 var(--trait); text-align: center; display: grid; place-items: center; min-height: 64px; }
.scene .gros { font-size: 48px; line-height: 1.15; }
.scene .lettre { font-size: 72px; line-height: 1; font-weight: 700; }
.scene .mots { font-size: 34px; font-weight: 700; }
.scene .chiffre { font-family: var(--titre); font-size: 64px; font-weight: 800; line-height: 1; }
.scene .tas { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 8px; font-size: 38px; max-width: 320px; }
.scene .texte { margin: 0; font-size: 18px; line-height: 1.5; text-align: left; user-select: text; -webkit-user-select: text; }
.scene .phrase { font-size: 24px; font-weight: 700; line-height: 1.3; }
.tas i { font-style: normal; }

/* Contenu d'une réponse, quel que soit le jeu */
.r .lettre { font-size: 46px; font-weight: 700; line-height: 1; }
.r .chiffre { font-family: var(--titre); font-size: 44px; font-weight: 800; line-height: 1; }
.r .mots { font-size: 28px; font-weight: 700; line-height: 1.1; }
.r .phrase { font-size: 20px; font-weight: 700; line-height: 1.25; }
.r .emoji { font-size: 44px; line-height: 1.1; display: block; }
.r .legende { font-size: 15px; display: block; }
.r .gros { font-size: 40px; }
.r .tas { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 2px; font-size: 24px; max-width: 120px; }

/* Jeu de la pêche et des ballons : une aire où les réponses bougent */
.aire { position: relative; flex: 1; min-height: 260px; overflow: hidden; }
.aire.eau { background: linear-gradient(#bfe9fb, var(--mer) 30%, var(--mer-fonce)); }
.aire.eau::before { content: ""; position: absolute; inset: 0 0 auto; height: 16px; background: radial-gradient(circle at 10px -4px, transparent 12px, #bfe9fb 13px) 0 0 / 20px 16px repeat-x; opacity: .9; }
.aire.ciel { background: linear-gradient(#9fd8ff, #dff3ff 70%, var(--savane)); }
.mobile { position: absolute; left: 0; top: 0; will-change: transform; display: grid; place-items: center; text-align: center; }
.poisson { min-width: 96px; height: 84px; padding: 0 16px 0 22px; border-radius: 50% 44% 44% 50% / 50%; background: #ffcf5a; box-shadow: inset -6px -6px 0 rgba(0,0,0,.08); }
.poisson::after { content: ""; position: absolute; top: 50%; width: 0; height: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent; transform: translateY(-50%); }
.poisson.droite::after { left: -22px; border-right: 26px solid #ffcf5a; }
.poisson.gauche::after { right: -22px; border-left: 26px solid #ffcf5a; }
.poisson::before { content: ""; position: absolute; top: 24px; width: 10px; height: 10px; border-radius: 50%; background: var(--encre); }
.poisson.droite::before { right: 12px; }
.poisson.gauche::before { left: 12px; }
.poisson.c1, .poisson.c1::after { background: #ff9f7a; border-left-color: #ff9f7a; border-right-color: #ff9f7a; }
.poisson.c2, .poisson.c2::after { background: #b9a4ff; border-left-color: #b9a4ff; border-right-color: #b9a4ff; }
.poisson.c3, .poisson.c3::after { background: #7fe0a8; border-left-color: #7fe0a8; border-right-color: #7fe0a8; }
.poisson.c1::after, .poisson.c2::after, .poisson.c3::after { background: none; }
.ballon { width: 104px; height: 120px; border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%; background: #ff7a6b; box-shadow: inset -10px -10px 0 rgba(0,0,0,.1); padding: 8px; box-sizing: border-box; }
.ballon::after { content: ""; position: absolute; left: 50%; bottom: -40px; width: 2px; height: 40px; background: rgba(0,0,0,.25); }
.ballon.c1 { background: #ffd23f; } .ballon.c2 { background: #7cc6ff; } .ballon.c3 { background: #8ee08a; }
.mobile.faux { filter: grayscale(.8) brightness(.9); }
.mobile.pris { transition: transform .5s ease-in, opacity .5s; opacity: 0; }
.bateau { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); font-size: 50px; z-index: 2; pointer-events: none; }
.prises { position: absolute; top: 10px; right: 12px; z-index: 2; font-family: var(--titre); font-weight: 800; font-size: 20px; background: rgba(255,255,255,.85); border-radius: 999px; padding: 2px 12px; }
.eclat { position: absolute; z-index: 3; pointer-events: none; font-size: 26px; animation: eclat .7s ease-out forwards; }
@keyframes eclat { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }

/* Course de pirogues */
.course { margin: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); border-radius: 20px; background: linear-gradient(var(--mer), var(--mer-fonce)); padding: 10px 12px; display: grid; gap: 6px; position: relative; }
.couloir { position: relative; height: 46px; border-bottom: 2px dashed rgba(255,255,255,.5); }
.couloir:last-of-type { border-bottom: 0; }
.couloir .pirogue { position: absolute; top: 0; left: 0; font-size: 38px; transition: left .5s ease-out; transform: scaleX(-1); }
.couloir .qui { position: absolute; top: 10px; font-size: 18px; transition: left .5s ease-out; }
.couloir .nom { position: absolute; right: 26px; top: 12px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.95); }
.arrivee { position: absolute; right: 10px; top: 6px; bottom: 6px; width: 8px; background: repeating-linear-gradient(#fff 0 8px, var(--encre) 8px 16px); border-radius: 2px; }
.choix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.choix.trois { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choix.ligne { grid-template-columns: 1fr; }
.reponse { background: var(--carte); border-radius: 18px; min-height: 76px; padding: 8px; display: grid; place-items: center; text-align: center; box-shadow: 0 5px 0 var(--trait); border: 3px solid transparent; }
.reponse:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--trait); }
.reponse.bon { border-color: var(--vert); background: #e6f6ec; animation: saute .4s; }
.reponse.faux { border-color: var(--rouge); background: #fdeae6; animation: secoue .4s; }
@keyframes saute { 40% { transform: scale(1.06); } }
@keyframes secoue { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.bravo { position: fixed; left: 0; right: 0; top: 40%; z-index: 30; text-align: center; font-family: var(--titre); font-weight: 800; font-size: 40px; color: var(--vert); text-shadow: 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff; pointer-events: none; animation: pop .9s forwards; }
@keyframes pop { from { opacity: 0; transform: scale(.6); } 25% { opacity: 1; transform: scale(1.1); } 60% { transform: scale(1); opacity: 1; } to { opacity: 0; transform: translateY(-30px); } }

/* Résultat */
.resultat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
.resultat .grandes-etoiles { font-size: 60px; letter-spacing: 6px; }
.resultat .grandes-etoiles span { display: inline-block; animation: etoile .5s backwards; }
.resultat .grandes-etoiles span:nth-child(2) { animation-delay: .25s; } .resultat .grandes-etoiles span:nth-child(3) { animation-delay: .5s; }
@keyframes etoile { from { transform: scale(0) rotate(-90deg); } }
.resultat h1 { font-size: 38px; font-weight: 800; }
.resultat p { margin: 0; color: var(--doux); font-size: 19px; }
.gain { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.gain span { background: var(--carte); border-radius: 999px; padding: 6px 14px; font-family: var(--titre); font-weight: 800; font-size: 20px; box-shadow: 0 3px 0 var(--trait); }
.nouvel-animal { display: grid; gap: 4px; justify-items: center; background: var(--carte); border-radius: 22px; padding: 12px 22px; box-shadow: 0 4px 0 var(--trait); }
.nouvel-animal b { font-size: 60px; line-height: 1; animation: etoile .6s .7s backwards; }

/* Boutique et album */
.grille { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.objet { background: var(--carte); border-radius: 18px; padding: 10px 6px; display: grid; justify-items: center; gap: 4px; box-shadow: 0 4px 0 var(--trait); border: 3px solid transparent; }
.objet b { font-size: 40px; line-height: 1.1; }
.objet span { font-size: 14px; }
.objet .prix { font-family: var(--titre); font-weight: 800; font-size: 16px; }
.objet.porte { border-color: var(--vert); }
.objet.cache b { filter: brightness(0); opacity: .25; }
.titre-page { display: flex; align-items: center; gap: 12px; }
.titre-page h1 { font-size: 28px; font-weight: 800; }
.aide { color: var(--doux); font-size: 15px; margin: 0; }

/* Espace parent */
.pave { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; justify-content: center; }
.pave button { height: 64px; border-radius: 16px; background: var(--carte); font-family: var(--titre); font-size: 28px; font-weight: 800; box-shadow: 0 3px 0 var(--trait); }
.points { display: flex; gap: 12px; justify-content: center; }
.points i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--doux); }
.points i.plein { background: var(--encre); border-color: var(--encre); }
.parent { font-family: system-ui, sans-serif; font-size: 16px; user-select: text; -webkit-user-select: text; }
.parent h1 { font-size: 26px; }
.parent h2 { font-size: 19px; margin-top: 8px; }
.bloc { background: var(--carte); border-radius: 16px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 2px 0 var(--trait); }
.bloc table { width: 100%; border-collapse: collapse; font-size: 15px; }
.bloc td { padding: 6px 4px; border-top: 1px solid var(--trait); vertical-align: top; }
.bloc td:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bloc tr:first-child td { border-top: 0; }
.rangee { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rangee label { flex: 1; min-width: 160px; }
.rangee input { font: inherit; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--trait); width: 140px; background: var(--sable); color: var(--encre); }
.petit-bouton { background: var(--theme); color: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 700; }
.petit-bouton.danger { background: var(--rouge); }
.petit-bouton.neutre { background: var(--trait); color: var(--encre); }
.note { color: var(--doux); font-size: 14px; margin: 0; }
.stat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
.stat b { display: block; font-family: var(--titre); font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--doux); }
.discret { font-size: 13px; color: var(--doux); text-align: center; padding: 6px; }
/* Question du jour, coffre, bulletin, récompenses */
.qdj { display: flex; align-items: center; gap: 12px; background: linear-gradient(90deg, var(--mangue), #ffd36b); border-radius: 18px; padding: 8px 14px; text-align: left; box-shadow: 0 4px 0 rgba(0,0,0,.15); animation: battre 2s infinite; }
.qdj b { display: block; font-family: var(--titre); font-size: 19px; line-height: 1.1; }
.qdj small { font-size: 14px; }
.coffre-mini { font-size: 34px; }
.coffre { font-size: 110px; line-height: 1; animation: battre 1.2s infinite; }
.coffre.ouvre { animation: secoue .5s 2; }
.indice { box-shadow: 0 0 0 5px var(--mangue), 0 0 24px var(--mangue) !important; }
.bulletin { background: #fffdf7; border: 2px solid var(--trait); border-radius: 6px; padding: 16px; font-family: Georgia, "Times New Roman", serif; display: grid; gap: 12px; box-shadow: 0 6px 0 var(--trait); user-select: text; }
.entete-bulletin { display: grid; gap: 2px; text-align: center; border-bottom: 2px solid var(--encre); padding-bottom: 8px; }
.entete-bulletin b { font-size: 20px; text-transform: uppercase; letter-spacing: .06em; }
.bulletin table { width: 100%; border-collapse: collapse; font-size: 15px; }
.bulletin th, .bulletin td { border: 1px solid #cbbfae; padding: 6px; text-align: left; }
.bulletin td:nth-child(2) { text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bulletin .total td { font-weight: 700; background: #f6efe1; }
.signature { margin: 0; font-style: italic; color: var(--doux); }
.sous-titre { font-size: 22px; margin-top: 10px; }
.bons { display: grid; gap: 8px; }
.bon-ligne { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; background: var(--carte); border-radius: 14px; padding: 10px 12px; text-align: left; box-shadow: 0 3px 0 var(--trait); }
.bon-ligne b { font-size: 28px; }
.bon-ligne .prix { font-family: var(--titre); font-weight: 800; }
.bon-ligne.demande { box-shadow: none; border: 2px dashed var(--trait); }
.statut { font-size: 14px; font-weight: 700; white-space: nowrap; }
.statut.accorde { color: var(--vert); } .statut.refuse { color: var(--doux); }
.resume { display: grid; gap: 4px; font-size: 15px; }
.resume ul { margin: 0 0 6px; padding-left: 20px; }
.lien { color: var(--theme); text-decoration: underline; font-weight: 700; padding: 0; }
details summary { cursor: pointer; font-weight: 700; color: var(--theme); }
details[open] { display: grid; gap: 8px; }

/* Coin de Bineta, livre de Soubeyrou, lutte */
.coin-grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.coin-case { background: var(--carte); border-radius: 22px; padding: 18px 8px; display: grid; justify-items: center; gap: 6px; box-shadow: 0 5px 0 var(--trait); }
.coin-case b { font-size: 64px; line-height: 1; }

<script>
/* ---------- Contenu propre à l'enfant ---------- */
/* Contenu de l'appli Grande Section. Préscolaire sénégalais, palier 1 : début d'année. */
(function () {
  const hasard = a => a[Math.floor(Math.random() * a.length)];
  const melange = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const tirer = (a, n) => melange(a).slice(0, n);
  const fois = (n, f) => Array.from({ length: n }, (_, i) => f(i));
  const NOMBRES = ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix"];
  const de = mot => (/^[aeiouyéèêœh]/i.test(mot) ? "d'" : "de ") + mot;
  function q(consigne, scene, bonne, autres, extra) {
    return Object.assign({ consigne, scene, choix: [bonne].concat(autres), bonne: 0 }, extra || {});
  }
  const img = ([nom, e, art]) => ({ k: "image", e, dire: (art || "") + nom });

  // ---------- PARLER ET LIRE ----------
  const COULEURS = [["rouge", "#e0533d"], ["bleu", "#2f6fd1"], ["jaune", "#f5c518"], ["vert", "#2e9e5b"], ["orange", "#f08a1c"], ["violet", "#8a4fd6"]];
  const tache = ([nom, c]) => ({ k: "html", html: '<span style="display:block;width:64px;height:64px;border-radius:50%;background:' + c + '"></span>', dire: nom });
  function couleurs() {
    return () => fois(8, i => {
      const c = COULEURS[i % COULEURS.length];
      return q("Touche le " + c[0], null, tache(c), tirer(COULEURS.filter(x => x !== c), 2).map(tache), { dire: "Touche la couleur " + c[0] + ".", disposition: "trois" });
    });
  }

  const VOYELLES = ["A", "E", "I", "O", "U"];
  const CONSONNES = ["M", "L", "P", "T", "B", "S", "R", "N"];
  const NOM_LETTRE = { A: "a", E: "e", I: "i", O: "o", U: "u", M: "aime", L: "elle", P: "pé", T: "té", B: "bé", S: "esse", R: "erre", N: "aine" };
  const lettre = l => ({ k: "lettre", t: l, dire: "la lettre " + NOM_LETTRE[l] });
  function reconnaitre(liste, pool) {
    return () => fois(8, i => {
      const l = liste[i % liste.length];
      return q("Touche la lettre " + l, null, lettre(l), tirer(pool.filter(x => x !== l), 2).map(lettre), { dire: "Touche la lettre " + NOM_LETTRE[l] + ".", disposition: "trois" });
    });
  }
  function pareilles() {
    const pool = VOYELLES.concat(CONSONNES);
    return () => fois(8, () => {
      const l = hasard(pool);
      return q("Trouve la même lettre", { k: "lettre", t: l }, { k: "lettre", t: l }, tirer(pool.filter(x => x !== l), 2).map(x => ({ k: "lettre", t: x })),
        { dire: "Regarde bien la lettre. Trouve la même.", disposition: "trois" });
    });
  }

  // Premier son : le mot commence par…
  const DEBUTS = {
    A: [["ananas", "🍍"], ["avion", "✈️"], ["arbre", "🌳"], ["abeille", "🐝"]],
    O: [["orange", "🍊"], ["os", "🦴"], ["oreille", "👂"], ["oiseau", "🐦"]],
    M: [["mangue", "🥭"], ["moto", "🏍️"], ["mouton", "🐑"], ["maison", "🏠"]],
    L: [["lion", "🦁"], ["lune", "🌙"], ["lit", "🛏️"], ["lapin", "🐇"]],
    P: [["poisson", "🐟"], ["pomme", "🍎"], ["poule", "🐔"], ["pied", "🦶"]],
    B: [["banane", "🍌"], ["ballon", "⚽"], ["bébé", "👶"], ["bus", "🚌"]],
  };
  function premierSon() {
    const cles = Object.keys(DEBUTS);
    const nomSon = { A: "a", O: "o", M: "mmm", L: "lll", P: "p", B: "b" };
    return () => fois(8, i => {
      const l = cles[i % cles.length];
      const bon = hasard(DEBUTS[l]);
      const autres = tirer(cles.filter(x => x !== l).flatMap(x => DEBUTS[x]), 2);
      return q("Quel mot commence par " + l + " ?", { k: "lettre", t: l }, { k: "image", e: bon[1], t: bon[0], dire: bon[0] },
        autres.map(([m, e]) => ({ k: "image", e, t: m, dire: m })), { dire: "Quel mot commence par le son " + nomSon[l] + " ? Écoute bien.", disposition: "trois" });
    });
  }

  const ANIMAUX = [["lion", "🦁", "le "], ["chèvre", "🐐", "la "], ["mouton", "🐑", "le "], ["poule", "🐔", "la "], ["vache", "🐄", "la "], ["cheval", "🐎", "le "], ["chat", "🐈", "le "], ["chien", "🐕", "le "], ["éléphant", "🐘", "l'"], ["girafe", "🦒", "la "], ["singe", "🐒", "le "], ["poisson", "🐟", "le "]];

    return () => tirer(liste, 8).map(x => q("Touche " + x[2] + x[0], null, img(x), tirer(liste.filter(y => y !== x), 2).map(img), { dire: "Touche " + x[2] + x[0] + ".", disposition: "trois" }));

  // ---------- COMPTER ----------
  const OBJETS = [["mangues", "🥭"], ["poissons", "🐟"], ["chèvres", "🐐"], ["ballons", "⚽"], ["étoiles", "⭐"], ["poules", "🐔"]];

    const noms = Object.keys(FORMES);
    const f = n => ({ k: "html", html: FORMES[n], dire: "le " + n });

  }

  function intrus() {

    const motifs = [["🔴", "🔵"], ["🥭", "🍌"], ["⭐", "🌙"], ["🐔", "🐐"], ["🟢", "🟡"], ["🔺", "⚪"]];
    return () => fois(8, i => {
      const [a, b] = hasard(motifs);

      const suite = fois(trois ? 5 : 5, k => motif[k % motif.length]);
      const bon = motif[suite.length % motif.length];
      const choix = [bon].concat(motif.filter(x => x !== bon)).concat(trois ? [] : [hasard(["🍎", "🐈", "🌳"])]);
      return q("Qu'est-ce qui vient après ?", { k: "tas", items: suite.concat(["❓"]) }, { k: "image", e: bon }, choix.slice(1).map(e => ({ k: "image", e })),

<script>

  const NIVEAU_BOSS = { id: C.id + "-boss", titre: "Composition du " + (C.paliers[0].titre || "palier").toLowerCase(), lieu: BOSS.nom, decor: "boss", animal: BOSS.e, nomAnimal: BOSS.animal, jeu: "composition", boss: true, icone: BOSS.e, objectif: "Révision de tout le palier",

  // ----- Mémoire du téléphone -----
  const defaut = () => ({ prenom: "", code: "1234", toutOuvert: false, progres: {}, journal: [], jours: {}, pieces: 0, achats: [], porte: "", album: [], serie: { jour: "", n: 0 }, erreurs: [], diff: {}, qdj: "", bulletins: [], bons: [], catalogue: null, bonjour: "", equipe: {}, animal: null, jetons: { manger: 2, laver: 2, jouer: 2 }, coloriages: {}, lettresTracees: [] });
  let E = defaut();

  const parole = "speechSynthesis" in window ? window.speechSynthesis : null;
  function choisirVoix() {
    if (!parole) return;
    const v = parole.getVoices().filter(v => /^fr/i.test(v.lang));

  }
  if (parole) { choisirVoix(); parole.onvoiceschanged = choisirVoix; }
  function dire(texte) {

    try { parole.cancel(); const u = new SpeechSynthesisUtterance(texte); u.lang = "fr-FR"; u.rate = 0.85; u.pitch = 1.05; if (voix) u.voice = voix; parole.speak(u); } catch (e) {}

    }
    dire(texte);
  }

  function son(type) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const notes = { bon: [660, 880], faux: [220, 180], piece: [988, 1319], gagne: [523, 659, 784, 1047], pop: [500] }[type];

        const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.11;
        o.type = type === "faux" ? "triangle" : "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

    if (E.qdj !== aujourdhui()) html = html.replace(/<\/div><\/div>$/, '</div><button class="qdj" id="btnQdj"><span class="coffre-mini">🎁</span><span><b>Question du jour</b><small>Ouvre le coffre !</small></span></button></div>');
    html += '<div class="voyage" id="voyage"><svg class="route" id="route" aria-hidden="true"></svg>';
    let decor = "";
    NIVEAUX.forEach((n, i) => {
      if (n.decor !== decor) { if (decor) html += "</div>"; decor = n.decor; html += '<div class="zone" style="background:' + DECORS[decor][1] + '"><div class="zone-nom">' + DECORS[decor][0] + "</div>"; }
      const ok = ouvert(i), et = etoilesDe(n);
      html += '<div class="etape"><button class="noeud' + (et ? " fini" : "") + (ok ? "" : " ferme") + (i === actuel ? " actuel" : "") + '" data-i="' + i + '" style="left:' + xDe(i) + 'px" aria-label="' + esc(n.lieu + ", " + n.titre) + '">' +
        (i === actuel ? '<span class="moi">' + persoHTML() + "</span>" : "") +
        '<span class="bulle">' + (ok ? esc(n.icone) : "🔒") + '</span><span class="lieu">' + esc(n.lieu) + "</span>" + (et ? etoilesHTML(et) : "") + "</button></div>";
    });
    html += "</div>";
    const bOk = bossOuvert(), bEt = etoilesDe(NIVEAU_BOSS);
    html += '<div class="zone" style="background:' + (BOSS.fond || "var(--foret)") + '"><div class="zone-nom">' + esc(BOSS.zone) + '</div><div class="etape" style="height:150px"><button class="noeud boss' + (bOk ? (bEt ? " fini" : " actuel") : " ferme") + '" data-i="boss" style="left:' + Math.round(largeur / 2) + 'px">' +
      '<span class="bulle">' + (bOk ? BOSS.e : "🔒") + '</span><span class="lieu">' + esc(BOSS.titre) + "</span>" + (bEt ? etoilesHTML(bEt) : "") + "</button></div></div></div>";
    $ecran.innerHTML = html;
    // Route en pointillés entre les étapes
    requestAnimationFrame(() => {
      const v = document.getElementById("voyage"), svg = document.getElementById("route");
      if (!v || !svg) return;
      const r0 = v.getBoundingClientRect();
      const pts = [...v.querySelectorAll(".noeud .bulle")].map(b => { const r = b.getBoundingClientRect(); return [r.left + r.width / 2 - r0.left, r.top + r.height / 2 - r0.top]; });
      svg.setAttribute("viewBox", "0 0 " + r0.width + " " + r0.height);
      let d = "";
      pts.forEach((p, i) => { if (!i) d = "M" + p[0] + " " + p[1]; else { const a = pts[i - 1]; d += " C" + a[0] + " " + (a[1] + 50) + " " + p[0] + " " + (p[1] - 50) + " " + p[0] + " " + p[1]; } });
      svg.innerHTML = '<path d="' + d + '" fill="none" stroke="rgba(43,33,24,.28)" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 18"/>';
      const cible = v.querySelector(".noeud.actuel");
      if (cible) $ecran.scrollTop = Math.max(0, cible.getBoundingClientRect().top - $ecran.getBoundingClientRect().top - 200);
    });
    $ecran.querySelectorAll(".noeud").forEach(b => b.onclick = () => {
      if (b.dataset.i === "boss") return bOk ? presenter(NIVEAU_BOSS) : dire(BOSS.bloque);
      const i = +b.dataset.i;
      if (!ouvert(i)) { son("faux"); dire("Termine d'abord l'étape d'avant."); return; }
      presenter(NIVEAUX[i]);
    });
    document.getElementById("btnParent").onclick = () => codeParent();
    document.getElementById("btnPerso").onclick = boutique;
    document.getElementById("btnAlbum").onclick = album;
    const be = document.getElementById("btnEquipe"); if (be) be.onclick = () => equipe();
    const bc = document.getElementById("btnCoin"); if (bc) bc.onclick = () => coin();
    const bl = document.getElementById("btnLivre"); if (bl) bl.onclick = () => livre(0);
    const bq = document.getElementById("btnQdj"); if (bq) bq.onclick = questionDuJour;
    const bb = document.getElementById("btnBulletin"); if (bb) bb.onclick = () => bulletin(E.bulletins[0], true);
    const acc = E.bons.filter(b => b.statut === "accorde" && !b.vu);
    if (acc.length) { acc.forEach(b => b.vu = true); sauver(); setTimeout(() => { bravo("🎟️ Récompense acceptée !"); parler("bon_ok", "Ta récompense est acceptée : " + acc[0].nom + " !"); }, 400); }
    if (E.bonjour !== aujourdhui()) document.addEventListener("click", function salut() { document.removeEventListener("click", salut, true); if (E.bonjour === aujourdhui()) return; E.bonjour = aujourdhui(); sauver(); parler("bonjour_" + C.id, "Bonjour " + prenom() + " !"); }, true);
  }

  function presenter(n) {
    let j = JEUX[n.jeu];
    const v = document.createElement("div"); v.className = "voile";
    if (n.jeu === "composition") j = { e: "📝", nom: "La composition", aide: "" };
    v.innerHTML = '<div class="fenetre" role="dialog" aria-label="' + esc(n.lieu) + '"><div class="grosse-icone">' + (n.boss ? "📝" : j.e) + "</div>" +
      "<h2>" + esc(n.boss ? n.titre : j.nom + " " + (H.a || "à") + " " + n.lieu) + "</h2><p>" + esc(n.boss ? "Une révision de tout le palier, comme en classe. Une seule réponse par question, puis ton bulletin !" : j.aide) + "</p>" +
      '<p style="font-size:15px">' + esc(n.titre) + "</p>" + (etoilesDe(n) ? etoilesHTML(etoilesDe(n)) : "") +
      '<div class="boutons"><button class="bouton second" id="fermer">Retour</button><button class="bouton" id="jouer">Jouer !</button></div></div>';
    document.body.appendChild(v);
    if (n.boss) parler("compo", "C'est l'heure de la composition. Concentre-toi bien !"); else dire(j.nom + " " + (H.a || "à") + " " + n.lieu + ". " + j.aide);
    v.onclick = e => { if (e.target === v) v.remove(); };
    v.querySelector("#fermer").onclick = () => v.remove();
    v.querySelector("#jouer").onclick = () => { v.remove(); jouer(n); };
  }

  // ----- Les mini-jeux -----
  // Difficulté de 1 (guidé) à 3 (défi), propre à chaque étape, ajustée après chaque partie.
  const difficulte = n => E.diff[n.id] || 2;
  const cleQ = q => q.consigne + "|" + JSON.stringify(q.choix[q.bonne]) + "|" + JSON.stringify(q.scene || "");
  function alleger(q) {
    if (q.choix.length <= 2) return q;
    const faux = q.choix.map((c, i) => i).filter(i => i !== q.bonne);
    const retire = faux[Math.floor(Math.random() * faux.length)];
    const choix = q.choix.filter((c, i) => i !== retire);
    return Object.assign({}, q, { choix, bonne: choix.indexOf(q.choix[q.bonne]), disposition: q.disposition === "trois" ? "" : q.disposition });
  }
  function noterErreur(p, q) {
    const cle = cleQ(q);
    if (E.erreurs.some(x => x.cle === cle)) return;
    const propre = Object.assign({}, q); delete propre._rattrapage;
    E.erreurs.unshift({ cle, id: q._lecon || p.n.id, q: propre, date: new Date().toISOString() });
    E.erreurs = E.erreurs.slice(0, 60);
    sauver();
  }
  function effacerErreur(q) { const cle = q._rattrapage || cleQ(q); E.erreurs = E.erreurs.filter(x => x.cle !== cle); sauver(); }

  function jouer(n) {
    changer();
    if (n.jeu === "composition") return composition(n);
    $ecran.className = "ecran sans-marge";
    const d = difficulte(n);
    let questions = n.questions().slice(0, d === 3 ? 10 : 8).map(q => Object.assign({ _lecon: n.id }, q));
    E.erreurs.filter(x => x.id === n.id).slice(0, 2).forEach((x, i) => { questions[questions.length - 1 - i] = Object.assign({}, x.q, { _rattrapage: x.cle, _lecon: n.id }); });
    questions = melange(questions);
    if (d === 1) questions = questions.map(alleger);
    const partie = { n, questions, k: 0, justes: 0, premier: true, d, vit: d === 1 ? 0.75 : d === 3 ? 1.25 : 1 };
    ({ peche: jeuPeche, ballons: jeuBallons, pirogue: jeuPirogue, match: jeuMatch, lutte: jeuLutte })[n.jeu](partie);
  }

  function enTete(p, q) {
    p.qc = q;
    return '<div class="jeu-haut"><div class="barre"><button class="rond" id="quitter" aria-label="Quitter">✕</button><div class="progression"><i style="width:' + Math.round(100 * p.k / p.questions.length) + '%"></i></div>' +
      '<span class="pastille">' + (p.n.boss ? BOSS.e : p.n.jeu === "qdj" ? "🎁" : JEUX[p.n.jeu].e) + " " + p.k + "/" + p.questions.length + "</span></div>" +
      '<div class="consigne"><button class="haut-parleur" id="ecouter" aria-label="Écouter">🔊</button><p>' + esc(q.consigne) + "</p></div>" +
      (q.scene ? '<div class="scene">' + rendu(q.scene) + "</div>" : "") + "</div>";
  }
  function brancher(p, q) {
    const ecoute = () => dire(q.dire || q.consigne);
    document.getElementById("ecouter").onclick = ecoute;
    document.getElementById("quitter").onclick = carte;
    if (C.voixAuto !== false) ecoute();
  }
  function reussite(p, suite) {
    if (p.premier) { p.justes++; if (p.qc && p.qc._rattrapage) effacerErreur(p.qc); }
    son("bon");
    const mot = MOTS_BRAVO[Math.floor(Math.random() * MOTS_BRAVO.length)];
    bravo(mot); parler(C.habillage && Math.random() < 0.3 ? "but" : "bravo", mot);
    p.k++; p.premier = true;
    setTimeout(() => (p.k < p.questions.length ? suite() : (p.fin || fin)(p)), 1000);
  }
  function rate(p, choix) {
    if (p.premier && p.qc) noterErreur(p, p.qc);
    p.premier = false;
    son("faux");
    const aide = choix && choix.dire ? " Ça, c'est " + choix.dire + "." : "";
    if (VOIX.faux && VOIX.faux.length) { parler("faux", "Essaie encore."); setTimeout(() => aide && dire(aide), 1500); } else dire("Essaie encore." + aide);
    if (p.d === 1 && p.qc) { const b = $ecran.querySelector('[data-i="' + p.qc.bonne + '"]'); if (b) b.classList.add("indice"); }
  }
  function eclats(aire, x, y, emojis) {
    for (let i = 0; i < 8; i++) {
      const s = document.createElement("span"); s.className = "eclat"; s.textContent = emojis[i % emojis.length];
      s.style.left = x + "px"; s.style.top = y + "px";
      const a = (i / 8) * Math.PI * 2; s.style.setProperty("--dx", Math.cos(a) * 70 + "px"); s.style.setProperty("--dy", Math.sin(a) * 70 + "px");
      aire.appendChild(s); setTimeout(() => s.remove(), 750);
    }
  }

  // Des réponses qui bougent dans une aire (poissons qui nagent, ballons qui montent)
  function jeuMobile(p, mode) {
    function poser() {
      arreter();
      const q = p.questions[p.k];
      const ordre = melange(q.choix.map((c, i) => i));
      $ecran.innerHTML = '<div class="jeu">' + enTete(p, q) + '<div class="aire ' + (mode === "peche" ? H.eau : H.ciel) + '" id="aire">' +
        (mode === "peche" ? '<span class="bateau">' + H.bateau + "</span>" : "") + '<span class="prises">' + H.prises[mode] + " " + p.k + "</span></div></div>";
      brancher(p, q);
      const aire = document.getElementById("aire");
      const W = aire.clientWidth, HA = aire.clientHeight;
      const objets = ordre.map((ci, rang) => {
        const b = document.createElement("button");
        b.className = "mobile r " + H.mobiles[mode] + " c" + (rang % 4);
        b.innerHTML = rendu(q.choix[ci]);
        b.dataset.i = ci;
        aire.appendChild(b);
        const w = b.offsetWidth, h = b.offsetHeight;
        const o = { b, ci, w, h, vivant: true };
        if (mode === "peche") {
          const couloirs = ordre.length, haut = 70, bas = HA - h - 10;
          o.y = haut + (couloirs > 1 ? (rang * (bas - haut)) / (couloirs - 1) : 0);
          o.dir = rang % 2 ? -1 : 1;
          b.classList.add(o.dir > 0 ? "droite" : "gauche");
          o.v = (34 + Math.random() * 22) * VITESSE * (p.vit || 1);
          o.x = Math.random() * Math.max(10, W - w);
        } else {
          const col = ordre.length;
          o.x = ((rang + 0.5) * W) / col - w / 2 + (Math.random() * 20 - 10);
          o.y = HA * 0.3 + Math.random() * HA * 0.45;
          o.v = (26 + Math.random() * 16) * VITESSE * (p.vit || 1);
          o.phase = Math.random() * 6;
        }
        b.onclick = () => toucher(o, q);
        return o;
      });
      let dernier = performance.now(), anim = 0, fini = false;
      function boucle(t) {
        const dt = Math.min(0.05, (t - dernier) / 1000); dernier = t;
        objets.forEach(o => {
          if (!o.vivant) return;
          if (mode === "peche") {
            o.x += o.dir * o.v * dt;
            if (o.dir > 0 && o.x > W + 20) o.x = -o.w - 20;
            if (o.dir < 0 && o.x < -o.w - 20) o.x = W + 20;
            o.b.style.transform = "translate(" + o.x + "px," + (o.y + Math.sin(t / 500 + o.v) * 6) + "px)";
          } else {
            o.y -= o.v * dt;
            if (o.y < -o.h - 50) o.y = HA + 30;
            o.b.style.transform = "translate(" + (o.x + Math.sin(t / 700 + o.phase) * 10) + "px," + o.y + "px)";
          }
        });
        if (!fini) anim = requestAnimationFrame(boucle);
      }
      anim = requestAnimationFrame(boucle);
      arreter = () => { fini = true; cancelAnimationFrame(anim); };
      function toucher(o, q) {
        if (!o.vivant) return;
        const r = o.b.getBoundingClientRect(), ra = aire.getBoundingClientRect();
        if (o.ci === q.bonne) {
          objets.forEach(x => x.vivant = false);
          if (mode === "peche") { o.b.classList.add("pris"); o.b.style.transform = "translate(" + (W / 2 - o.w / 2) + "px,-40px) scale(.5)"; eclats(aire, r.left - ra.left + r.width / 2, r.top - ra.top, ["💧", "✨"]); }
          else { son("pop"); o.b.style.visibility = "hidden"; eclats(aire, r.left - ra.left + r.width / 2, r.top - ra.top + r.height / 2, ["🎉", "✨", "⭐"]); }
          reussite(p, poser);
        } else {
          o.b.classList.add("faux"); o.vivant = false; o.b.disabled = true;
          if (mode === "ballons") { son("pop"); setTimeout(() => o.b.style.visibility = "hidden", 150); }
          rate(p, q.choix[o.ci]);
        }
      }
    }
    poser();
  }
  const jeuPeche = p => jeuMobile(p, "peche");
  const jeuBallons = p => jeuMobile(p, "ballons");

  function jeuPirogue(p) {
    const parQuestion = 10 / (VITESSE * (p.vit || 1)); // secondes laissées au rival par question
    const duree = parQuestion * p.questions.length;
    const debut = performance.now();
    let rivalArrive = false;
    p.rival = false;
    function poser() {
      arreter();
      const q = p.questions[p.k];
      const ordre = melange(q.choix.map((c, i) => i));
      const nb = q.choix.length;
      const dispo = q.disposition || (nb === 3 ? "trois" : "");
      $ecran.innerHTML = '<div class="jeu">' + enTete(p, q) +
        '<div class="course' + (H.course ? " " + H.course : "") + '" aria-hidden="true"><span class="arrivee"></span>' +
        '<div class="couloir"><span class="pirogue" id="pMoi">' + H.monture + '</span><span class="qui" id="qMoi">' + (H.passager || C.avatar) + '</span><span class="nom">' + esc(prenom()) + "</span></div>" +
        '<div class="couloir"><span class="pirogue" id="pRival">' + (H.montureRival || H.monture) + '</span><span class="qui" id="qRival">' + (p.n.boss ? BOSS.e : H.rival[0]) + '</span><span class="nom">' + esc(p.n.boss ? BOSS.rival : H.rival[1]) + "</span></div></div>" +
        '<div class="choix ' + dispo + '">' + ordre.map(i => '<button class="reponse r" data-i="' + i + '">' + rendu(q.choix[i]) + "</button>").join("") + "</div></div>";
      brancher(p, q);
      const course = $ecran.querySelector(".course");
      const L = course.clientWidth - 90;
      const placer = (id, f) => { const x = 4 + f * L; document.getElementById("p" + id).style.left = x + "px"; document.getElementById("q" + id).style.left = x + 12 + "px"; };
      placer("Moi", p.k / p.questions.length);
      let anim = 0, fini = false;
      function boucle(t) {
        const f = Math.min(1, (t - debut) / 1000 / duree);
        placer("Rival", f);
        if (f >= 1 && !rivalArrive) { rivalArrive = true; p.rival = true; dire((p.n.boss ? BOSS.rival : H.rival[1]) + " est arrivé ! Termine quand même."); }
        if (!fini) anim = requestAnimationFrame(boucle);
      }
      anim = requestAnimationFrame(boucle);
      arreter = () => { fini = true; cancelAnimationFrame(anim); };
      $ecran.querySelectorAll(".reponse").forEach(b => b.onclick = () => {
        const i = +b.dataset.i;
        if (i === q.bonne) {
          b.classList.add("bon");
          $ecran.querySelectorAll(".reponse").forEach(x => x.disabled = true);
          placer("Moi", (p.k + 1) / p.questions.length);
          reussite(p, poser);
        } else { b.classList.add("faux"); b.disabled = true; rate(p, q.choix[i]); }
      });
    }
    poser();
  }

  // Questions posées calmement, sans course (question du jour, composition).
  function jeuSimple(p, examen) {
    function poser() {
      const q = p.questions[p.k];
      const ordre = melange(q.choix.map((c, i) => i));
      const dispo = q.disposition || (q.choix.length === 3 ? "trois" : "");
      $ecran.innerHTML = '<div class="jeu">' + enTete(p, q) + '<div class="choix ' + dispo + '">' + ordre.map(i => '<button class="reponse r" data-i="' + i + '">' + rendu(q.choix[i]) + "</button>").join("") + "</div></div>";
      brancher(p, q);
      $ecran.querySelectorAll(".reponse").forEach(b => b.onclick = () => {
        const i = +b.dataset.i;
        if (examen) {
          $ecran.querySelectorAll(".reponse").forEach(x => x.disabled = true);
          const bonne = i === q.bonne;
          b.classList.add(bonne ? "bon" : "faux");
          if (!bonne) { $ecran.querySelector('.reponse[data-i="' + q.bonne + '"]').classList.add("bon"); noterErreur(p, q); }
          else if (q._rattrapage) effacerErreur(q);
          son(bonne ? "bon" : "faux");
          p.resultats.push({ monde: q._monde, bonne });
          p.k++;
          setTimeout(() => (p.k < p.questions.length ? poser() : p.fin(p)), bonne ? 700 : 1500);
        } else if (i === q.bonne) { b.classList.add("bon"); $ecran.querySelectorAll(".reponse").forEach(x => x.disabled = true); reussite(p, poser); }
        else { b.classList.add("faux"); b.disabled = true; rate(p, q.choix[i]); }
      });
    }
    poser();
  }

  function questionDuJour() {
    changer();
    $ecran.className = "ecran sans-marge";
    let q;
    if (E.erreurs.length) { const x = E.erreurs[Math.floor(Math.random() * E.erreurs.length)]; q = Object.assign({}, x.q, { _rattrapage: x.cle, _lecon: x.id }); }
    else {
      const faits = NIVEAUX.filter(n => etoilesDe(n) > 0);
      const n = (faits.length ? faits : NIVEAUX.slice(0, 1))[Math.floor(Math.random() * Math.max(1, faits.length))];
      q = Object.assign({ _lecon: n.id }, n.questions()[0]);
    }
    const p = { n: { id: "qdj", jeu: "qdj" }, questions: [q], k: 0, justes: 0, premier: true, d: 2 };
    p.fin = () => coffre(p.justes > 0);
    parler("qdj", "Voici la question du jour !");
    setTimeout(() => jeuSimple(p, false), 300);
  }

  function coffre(premierCoup) {
    changer();
    $ecran.className = "ecran";
    E.qdj = aujourdhui(); serieDuJour();
    let gain = premierCoup ? [15, 20, 25, 30][Math.floor(Math.random() * 4)] : 10, cadeau = null;
    const libres = BOUTIQUE.filter(x => !E.achats.includes(x[0]) && x[2] <= 50);
    if (premierCoup && libres.length && Math.random() < 0.25) { cadeau = libres[Math.floor(Math.random() * libres.length)]; E.achats.push(cadeau[0]); gain = 0; }
    E.pieces += gain;
    if (C.coin) E.jetons.manger = (E.jetons.manger || 0) + 1;
    sauver();
    $ecran.innerHTML = '<div class="resultat"><button class="coffre" id="ouvrir" aria-label="Ouvrir le coffre">🎁</button><h1>' + (premierCoup ? "Bravo !" : "Bien joué !") + "</h1><p>Touche le coffre pour l'ouvrir</p>" +
      '<div class="gain" id="contenu" hidden>' + (cadeau ? "<span>" + cadeau[0] + " " + esc(cadeau[1]) + " offert !</span>" : "<span>🪙 +" + gain + "</span>") + "</div>" +
      '<div class="boutons"><button class="bouton" id="suite" hidden>Continuer</button></div></div>';
    document.getElementById("ouvrir").onclick = e => {
      const b = e.currentTarget; if (b.dataset.ouvert) return; b.dataset.ouvert = "1";
      b.classList.add("ouvre"); son("piece");
      setTimeout(() => { b.textContent = cadeau ? cadeau[0] : "🪙"; document.getElementById("contenu").hidden = false; document.getElementById("suite").hidden = false; son("gagne"); parler("coffre", "Bravo, tu as ouvert le coffre !"); }, 700);
    };
    document.getElementById("suite").onclick = carte;
  }

  function composition(n) {
    $ecran.className = "ecran sans-marge";
    const questions = [];
    C.mondes.forEach(m => {
      const lecons = NIVEAUX.filter(x => x.monde === m);
      for (let k = 0; k < 4; k++) { const l = lecons[(k + Math.floor(Math.random() * lecons.length)) % lecons.length]; const q = melange(l.questions())[0]; questions.push(Object.assign({ _monde: m.titre, _lecon: l.id }, q)); }
    });
    const p = { n, questions: melange(questions), k: 0, justes: 0, premier: true, d: 2, resultats: [] };
    p.fin = finComposition;
    jeuSimple(p, true);
  }

  const APPRECIATION = note => note >= 9 ? "Excellent" : note >= 8 ? "Très bien" : note >= 7 ? "Bien" : note >= 6 ? "Assez bien" : note >= 5 ? "Passable" : "Peut mieux faire";
  const MENTION = moy => moy >= 8 ? "Félicitations" : moy >= 7 ? "Tableau d'honneur" : moy >= 5 ? "Encouragements" : "Doit fournir plus d'efforts";
  function finComposition(p) {
    const notes = C.mondes.map(m => { const r = p.resultats.filter(x => x.monde === m.titre); const ok = r.filter(x => x.bonne).length; return { matiere: m.titre, icone: m.icone, note: Math.round((10 * ok) / Math.max(1, r.length) * 2) / 2 }; });
    const moyenne = Math.round((notes.reduce((s, x) => s + x.note, 0) / notes.length) * 10) / 10;
    const b = { palier: C.paliers[0].titre, date: new Date().toISOString(), notes, moyenne, mention: MENTION(moyenne) };
    E.bulletins.unshift(b); E.bulletins = E.bulletins.slice(0, 12);
    const n = p.n, etoiles = moyenne >= 8 ? 3 : moyenne >= 6 ? 2 : 1, avant = E.progres[n.id] || { etoiles: 0, fois: 0 };
    E.progres[n.id] = { etoiles: Math.max(avant.etoiles, etoiles), fois: (avant.fois || 0) + 1, dernier: moyenne + "/10", date: b.date };
    E.journal.unshift({ id: n.id, score: moyenne + "/10", ratio: moyenne / 10, date: b.date });
    E.pieces += etoiles * 20; serieDuJour();
    if (!E.album.includes(n.animal)) E.album.push(n.animal);
    sauver();
    bulletin(b, false);
    son("gagne");
    parler(moyenne >= 6 ? "compo_bien" : "compo_courage", moyenne >= 6 ? "Quelle belle composition ! Félicitations !" : "La composition n'était pas facile. On va réviser ensemble.");
  }

  function bulletin(b, depuisCarte) {
    changer();
    $ecran.className = "ecran";
    const d = new Date(b.date).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    $ecran.innerHTML = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>Mon bulletin</h1></div>' +
      '<div class="bulletin"><div class="entete-bulletin"><b>' + esc(C.titreAppli) + "</b><span>Composition · " + esc(b.palier) + "</span><span>" + esc(prenom()) + " · " + esc(C.classe) + " · " + d + "</span></div>" +
      "<table><tr><th>Matière</th><th>Note</th><th>Appréciation</th></tr>" + b.notes.map(x => "<tr><td>" + x.icone + " " + esc(x.matiere) + "</td><td>" + String(x.note).replace(".", ",") + "/10</td><td>" + APPRECIATION(x.note) + "</td></tr>").join("") +
      '<tr class="total"><td>Moyenne</td><td>' + String(b.moyenne).replace(".", ",") + "/10</td><td>" + esc(b.mention) + "</td></tr></table>" +
      '<p class="signature">Signature du papa : ____________</p></div>' +
      (depuisCarte || E.bulletins.length < 2 ? "" : '<p class="aide">Bulletin précédent : ' + String(E.bulletins[1].moyenne).replace(".", ",") + "/10</p>") +
      '<div class="boutons"><button class="bouton" id="suite">' + (depuisCarte ? "Retour à la carte" : "Continuer") + "</button></div>";
    document.getElementById("retour").onclick = carte;
    document.getElementById("suite").onclick = carte;
  }

  // ----- Fin d'un niveau -----
  function fin(p) {
    changer();
    $ecran.className = "ecran";
    const n = p.n, total = p.questions.length;
    const ratio = p.justes / total;
    let etoiles = ratio >= 0.9 ? 3 : ratio >= 0.65 ? 2 : 1;
    const avant = E.progres[n.id] || { etoiles: 0, fois: 0 };
    E.diff[n.id] = Math.max(1, Math.min(3, difficulte(n) + (ratio >= 0.9 ? 1 : ratio < 0.6 ? -1 : 0)));
    let gain = etoiles * 5 + (avant.fois ? 0 : 10);
    const gagneCourse = n.jeu === "pirogue" && !p.rival;
    if (gagneCourse) gain += 5;
    gain += p.bonus || 0;
    E.progres[n.id] = { etoiles: Math.max(avant.etoiles, etoiles), fois: (avant.fois || 0) + 1, dernier: p.justes + "/" + total, date: new Date().toISOString() };
    E.journal.unshift({ id: n.id, score: p.justes + "/" + total, ratio, date: new Date().toISOString() });
    E.journal = E.journal.slice(0, 60);
    E.pieces += gain;
    if (C.coin) ["manger", "laver", "jouer"].forEach(k => E.jetons[k] = (E.jetons[k] || 0) + 1);
    serieDuJour();
    const nouveau = !E.album.includes(n.animal);
    if (nouveau) E.album.push(n.animal);
    sauver();
    son("gagne");
    const titres = ["Continue, tu progresses !", "Bien joué !", C.feminin ? "Championne !" : "Champion !"];
    $ecran.innerHTML = '<div class="resultat"><div class="grandes-etoiles">' + etoilesHTML(etoiles) + "</div><h1>" + esc(titres[etoiles - 1]) + "</h1>" +
      "<p>" + p.justes + " sur " + total + " du premier coup" + (p.texteFin ? " · " + p.texteFin : n.jeu === "pirogue" ? (gagneCourse ? " · " + H.victoire : " · " + H.defaite) : "") + "</p>" +
      '<div class="gain"><span>🪙 +' + gain + "</span><span>🔥 " + E.serie.n + " jour" + (E.serie.n > 1 ? "s" : "") + "</span></div>" +
      (nouveau ? '<div class="nouvel-animal">' + (n.carte ? carteHTML(n.carte, true) : "<b>" + n.animal + "</b>") + "<span>" + esc(H.album.nouveau) + esc(n.nomAnimal) + " !</span></div>" : "") +
      '<div class="boutons"><button class="bouton second" id="encore">Rejouer</button><button class="bouton" id="suite">Continuer</button></div></div>';
    parler("etoiles" + etoiles, titres[etoiles - 1] + " Tu gagnes " + gain + " pièces.");
    if (nouveau) setTimeout(() => parler("album", H.album.nouveau + n.nomAnimal + " !"), 2600);
    document.getElementById("encore").onclick = () => jouer(n);
    document.getElementById("suite").onclick = carte;
  }

  // ----- Boutique du personnage -----

      E.pieces -= prix; E.bons.unshift({ e, nom, prix, statut: "attente", date: new Date().toISOString() }); E.bons = E.bons.slice(0, 30); sauver();
      son("piece"); dire("Ta demande est envoyée à papa !");

    });
    document.getElementById("retour").onclick = carte;
    $ecran.querySelectorAll(".objet").forEach(b => b.onclick = () => {
      const [e, nom, prix] = BOUTIQUE.find(x => x[0] === b.dataset.e);
      if (E.achats.includes(e)) { E.porte = E.porte === e ? "" : e; sauver(); son("pop"); return boutique(E.porte ? "Tu portes : " + nom : "Tu as enlevé : " + nom); }
      if (E.pieces < prix) { son("faux"); dire("Il te manque " + (prix - E.pieces) + " pièces. Joue encore !"); return boutique("Il te manque " + (prix - E.pieces) + " pièces pour : " + nom); }
      E.pieces -= prix; E.achats.push(e); E.porte = e; sauver(); son("piece"); dire("Super ! Tu as acheté : " + nom);
      boutique("Bravo, tu as acheté : " + nom + " !");
    });

  // ----- Cartes de joueurs et équipe (CE2 foot) -----

  function cartes() {

    document.getElementById("btnEquipe").onclick = () => equipe();
    $ecran.querySelectorAll(".case-carte").forEach(b => b.onclick = () => { const c = liste.find(n => n.carte.nom === b.dataset.n); E.album.includes(c.carte.nom) ? dire(c.carte.nom + ", " + POSTES[c.carte.poste] + ". Note : " + c.carte.note) : dire("Gagne l'étape " + c.lieu + " pour obtenir cette carte."); });
  }
  const SCHEMA = [["ATT", "AG", 18, 18], ["ATT", "AC", 50, 12], ["ATT", "AD", 82, 18], ["MIL", "MG", 25, 42], ["MIL", "MC", 50, 48], ["MIL", "MD", 75, 42], ["DEF", "DG", 12, 70], ["DEF", "DCG", 37, 74], ["DEF", "DCD", 63, 74], ["DEF", "DD", 88, 70], ["G", "GB", 50, 92]];
  function equipe(choisir) {
    changer();
    $ecran.className = "ecran";
    const possedees = NIVEAUX.filter(n => n.carte && E.album.includes(n.carte.nom)).map(n => n.carte);
    const placees = Object.values(E.equipe);
    const notes = SCHEMA.map(([, id]) => possedees.find(c => c.nom === E.equipe[id])).filter(Boolean).map(c => c.note);
    const moy = notes.length ? Math.round(notes.reduce((a, b) => a + b, 0) / notes.length) : 0;
    let html = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>Mon équipe</h1><span style="flex:1"></span><span class="pastille">4-3-3 · ' + (moy || "–") + "</span></div>" +
      '<p class="aide">' + (notes.length === 11 ? "Équipe complète ! Tu as vu tout le palier. 🏆" : "Touche un poste pour y placer une de tes cartes. " + notes.length + "/11 joueurs.") + "</p>" +
      '<div class="pelouse-equipe">' + SCHEMA.map(([poste, id, x, y]) => { const c = possedees.find(k => k.nom === E.equipe[id]); return '<button class="poste" data-id="' + id + '" data-poste="' + poste + '" style="left:' + x + "%;top:" + y + '%">' + (c ? '<b>' + esc(c.nom.split(" ").pop()) + "</b><small>" + c.note + "</small>" : "<b>+</b><small>" + poste + "</small>") + "</button>"; }).join("") + "</div>";
    if (choisir) {
      const libres = possedees.filter(c => c.poste === choisir.poste && (!placees.includes(c.nom) || E.equipe[choisir.id] === c.nom));
      html += '<h2 class="sous-titre">Choisis ton ' + POSTES[choisir.poste].toLowerCase() + "</h2>" + (libres.length ? '<div class="grille cartes">' + libres.map(c => '<button class="case-carte" data-choix="' + esc(c.nom) + '">' + carteHTML(c, true) + "</button>").join("") + "</div>" : '<p class="aide">Tu n\'as pas encore de carte de ' + POSTES[choisir.poste].toLowerCase() + ". Continue ta carrière pour en gagner !</p>");
    }
    $ecran.innerHTML = html;
    document.getElementById("retour").onclick = cartes;
    $ecran.querySelectorAll(".poste").forEach(b => b.onclick = () => { son("pop"); equipe({ id: b.dataset.id, poste: b.dataset.poste }); setTimeout(() => $ecran.scrollTop = 9999, 50); });
    $ecran.querySelectorAll("[data-choix]").forEach(b => b.onclick = () => { E.equipe[choisir.id] = b.dataset.choix; sauver(); son("piece"); dire(b.dataset.choix + " entre sur le terrain !"); equipe(); });
  }

  // ----- Lutte sénégalaise (CI) : chaque bonne réponse pousse l'adversaire hors de l'arène -----
  function jeuLutte(p) {
    const adv = ["Tyson", "Boy Niang", "le Lion de Guédiawaye", "Balla Gaye", "Modou Lô", "Eumeu Sène"][Math.floor(Math.random() * 6)];
    let pos = 0; p.bakk = false;
    function poser() {
      arreter();
      const q = p.questions[p.k];
      const ordre = melange(q.choix.map((c, i) => i));
      const dispo = q.disposition || (q.choix.length === 3 ? "trois" : "");
      $ecran.innerHTML = '<div class="jeu">' + enTete(p, q) +
        '<div class="arene" aria-hidden="true"><span class="lutteurs" style="left:' + (50 + pos * 12) + '%"><span class="moi-l">' + C.avatar + '🤼🏾</span></span><span class="nom-adv">contre ' + esc(adv) + "</span></div>" +
        '<div class="choix ' + dispo + '">' + ordre.map(i => '<button class="reponse r" data-i="' + i + '">' + rendu(q.choix[i]) + "</button>").join("") + "</div></div>";
      brancher(p, q);
      $ecran.querySelectorAll(".reponse").forEach(b => b.onclick = () => {
        const i = +b.dataset.i;
        if (i === q.bonne) {
          b.classList.add("bon"); $ecran.querySelectorAll(".reponse").forEach(x => x.disabled = true);
          if (p.premier) pos = Math.min(3, pos + 1);
          const l = $ecran.querySelector(".lutteurs"); if (l) l.style.left = 50 + pos * 12 + "%";
          if (pos >= 3 && !p.bakk) { p.bakk = true; setTimeout(() => { bravo("Bàkk ! Tu as gagné !"); dire("Il a fait tomber " + adv + " ! Bàkk !"); }, 300); }
          reussite(p, poser);
        } else {
          b.classList.add("faux"); b.disabled = true;
          if (p.premier) pos = Math.max(-3, pos - 1);
          const l = $ecran.querySelector(".lutteurs"); if (l) l.style.left = 50 + pos * 12 + "%";
          rate(p, q.choix[i]);
        }
      });
    }
    p.fin = pp => { pp.texteFin = pp.bakk ? "Tu as battu " + adv + " !" : adv + " a résisté, revanche ?"; pp.bonus = pp.bakk ? 10 : 0; fin(pp); };
    poser();
  }

  // ----- Match commenté (CE2 foot) -----
  function jeuMatch(p) {
    const adv = ["Real Madrid", "l'Atlético", "le Jaraaf", "Casa Sports", "Génération Foot", "Teungueth FC", "le Bayern"][Math.floor(Math.random() * 7)];
    p.buts = 0; p.butsAdv = 0;
    let pos = 1, comm = "Coup d'envoi ! " + prenom() + " et ses coéquipiers contre " + adv + ".";
    const PHRASES_BUT = ["Passe courte, triangle, frappe… BUUUT !", "Il dribble le défenseur… et c'est le BUUUT !", "Centre de l'ailier, reprise… BUUUT !", "Une-deux à la Barça… BUUUT !"];
    const PHRASES_AVANCE = ["Belle passe vers l'avant !", "Il garde le ballon, le jeu avance.", "Triangle de passes, l'équipe monte.", "Contrôle orienté, il accélère !"];
    function poser() {
      arreter();
      const q = p.questions[p.k];
      const ordre = melange(q.choix.map((c, i) => i));
      const dispo = q.disposition || (q.choix.length === 3 ? "trois" : "");
      $ecran.innerHTML = '<div class="jeu">' + enTete(p, q) +
        '<div class="match"><div class="score"><span>' + esc(prenom()) + " FC</span><b>" + p.buts + " - " + p.butsAdv + "</b><span>" + esc(adv) + '</span></div>' +
        '<div class="terrain-match"><span class="but-g">🥅</span><span class="balle-match" style="left:' + (8 + pos * 21) + '%">⚽</span><span class="but-d">🥅</span></div><p class="commentaire">🎙️ ' + esc(comm) + "</p></div>" +
        '<div class="choix ' + dispo + '">' + ordre.map(i => '<button class="reponse r" data-i="' + i + '">' + rendu(q.choix[i]) + "</button>").join("") + "</div></div>";
      brancher(p, q);
      $ecran.querySelectorAll(".reponse").forEach(b => b.onclick = () => {
        const i = +b.dataset.i;
        if (i === q.bonne) {
          b.classList.add("bon"); $ecran.querySelectorAll(".reponse").forEach(x => x.disabled = true);
          if (p.premier) { pos++; if (pos >= 4) { p.buts++; pos = 1; comm = PHRASES_BUT[Math.floor(Math.random() * PHRASES_BUT.length)]; bravo("BUUUT !"); parler("but", "Buuut !"); } else comm = PHRASES_AVANCE[Math.floor(Math.random() * PHRASES_AVANCE.length)]; }
          else comm = "Il récupère le ballon, ouf !";
          const balle = $ecran.querySelector(".balle-match"); if (balle) balle.style.left = 8 + pos * 21 + "%";
          if (p.premier) p.justes++;
          if (p.qc && p.qc._rattrapage && p.premier) effacerErreur(p.qc);
          son("bon"); p.k++; p.premier = true;
          setTimeout(() => (p.k < p.questions.length ? poser() : finMatch()), 1200);
        } else {
          b.classList.add("faux"); b.disabled = true;
          if (p.premier) { pos--; if (pos < 0) { p.butsAdv++; pos = 1; comm = adv + " contre-attaque… et marque. Allez, on se reprend !"; } else comm = "Ballon perdu ! Il faut presser tout de suite."; }
          const c = $ecran.querySelector(".commentaire"); if (c) c.textContent = "🎙️ " + comm;
          const balle = $ecran.querySelector(".balle-match"); if (balle) balle.style.left = 8 + pos * 21 + "%";
          rate(p, q.choix[i]);
        }
      });
    }
    function finMatch() {
      p.texteFin = (p.buts > p.butsAdv ? "Victoire " : p.buts === p.butsAdv ? "Match nul " : "Défaite ") + p.buts + "-" + p.butsAdv + " contre " + adv;
      p.bonus = p.buts > p.butsAdv ? 10 : 0;
      fin(p);
    }
    poser();
  }

  // ----- Le coin de Bineta : animal, comptines, lettres, coloriage -----
  const ANIMAUX_COMPAGNONS = { lapin: ["🐰", "Pompon"], chaton: ["🐱", "Minou"], chiot: ["🐶", "Toutou"], poussin: ["🐥", "Piou"] };

  // Tracer une lettre avec le doigt : on vérifie qu'on a bien suivi la forme.
  function tracer(k) {
    changer();
    $ecran.className = "ecran";
    const lettres = C.lettresATracer || ["A", "E", "I", "O", "U"];
    const L = lettres[k % lettres.length];
    $ecran.innerHTML = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>J\'écris : ' + L + '</h1><span style="flex:1"></span><span class="pastille">' + (k % lettres.length + 1) + "/" + lettres.length + "</span></div>" +
      '<p class="aide">Suis la lettre avec ton doigt, sans sortir du chemin.</p><div class="ardoise"><canvas id="modele"></canvas><canvas id="trace"></canvas></div>' +
      '<div class="boutons"><button class="bouton second" id="effacer">Effacer</button><button class="bouton" id="verifier">J\'ai fini</button></div>';
    dire("Écris la lettre " + L + ". Suis le chemin avec ton doigt.");
    document.getElementById("retour").onclick = coin;
    const boite = $ecran.querySelector(".ardoise"), cm = document.getElementById("modele"), ct = document.getElementById("trace");
    const W = boite.clientWidth, Hh = Math.min(360, W);
    const dpr = window.devicePixelRatio || 1;
    [cm, ct].forEach(c => { c.width = W * dpr; c.height = Hh * dpr; c.style.width = W + "px"; c.style.height = Hh + "px"; c.getContext("2d").scale(dpr, dpr); });
    const xm = cm.getContext("2d"), xt = ct.getContext("2d");
    const dessinerModele = () => {
      xm.clearRect(0, 0, W, Hh);
      xm.font = "700 " + Math.round(Hh * 0.82) + "px Andika, sans-serif"; xm.textAlign = "center"; xm.textBaseline = "middle";
      xm.fillStyle = "#e8dcc6"; xm.fillText(L, W / 2, Hh / 2 + Hh * 0.04);
      xm.setLineDash([6, 10]); xm.lineWidth = 3; xm.strokeStyle = "#b9a98d"; xm.strokeText(L, W / 2, Hh / 2 + Hh * 0.04);
    };
    dessinerModele(); if (document.fonts) document.fonts.ready.then(dessinerModele);
    xt.lineWidth = Math.max(18, Hh * 0.08); xt.lineCap = "round"; xt.lineJoin = "round"; xt.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--theme").trim() || "#8a4fd6";
    let enCours = false;
    const pos = e => { const r = ct.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    ct.addEventListener("pointerdown", e => { enCours = true; ct.setPointerCapture(e.pointerId); const [x, y] = pos(e); xt.beginPath(); xt.moveTo(x, y); xt.lineTo(x + 0.1, y); xt.stroke(); });
    ct.addEventListener("pointermove", e => { if (!enCours) return; const [x, y] = pos(e); xt.lineTo(x, y); xt.stroke(); });
    ct.addEventListener("pointerup", () => enCours = false);
    ct.style.touchAction = "none";
    document.getElementById("effacer").onclick = () => xt.clearRect(0, 0, W, Hh);
    document.getElementById("verifier").onclick = () => {
      const a = xm.getImageData(0, 0, cm.width, cm.height).data, b = xt.getImageData(0, 0, ct.width, ct.height).data;
      let lettre = 0, couvert = 0, trait = 0, dehors = 0;
      for (let i = 0; i < a.length; i += 4 * 6) {
        const dansLettre = a[i + 3] > 40, dansTrait = b[i + 3] > 40;
        if (dansLettre) { lettre++; if (dansTrait) couvert++; }
        if (dansTrait) { trait++; if (!dansLettre) dehors++; }
      }
      const couverture = couvert / Math.max(1, lettre), ecart = dehors / Math.max(1, trait);
      if (couverture > 0.5 && ecart < 0.6) {
        son("gagne"); bravo("Bravo !"); parler("bravo", "Bravo, tu as bien écrit la lettre " + L + " !");
        if (!E.lettresTracees.includes(L)) { E.lettresTracees.push(L); E.jetons.laver = (E.jetons.laver || 0) + 1; }
        sauver();
        setTimeout(() => tracer(k + 1), 1500);
      } else { son("faux"); dire(couverture <= 0.5 ? "Continue, il manque un morceau de la lettre." : "Attention, reste bien sur le chemin."); }
    };
  }

      sauver(); parent(act === "ok" ? "Récompense accordée. " + prenom() + " verra la bonne nouvelle." : "Récompense refusée, les pièces sont rendues.");
    });
    $ecran.querySelectorAll("[data-suppr]").forEach(b => b.onclick = () => { const c = catalogue().slice(); c.splice(+b.dataset.suppr, 1); E.catalogue = c; sauver(); parent("Récompense retirée."); });
    const ajout = document.getElementById("okBon");
    if (ajout) ajout.onclick = () => { const nom = document.getElementById("champBon").value.trim(), prix = parseInt(document.getElementById("champPrix").value, 10); if (!nom || !(prix > 0)) return parent("Indique un nom et un prix en pièces."); E.catalogue = catalogue().concat([["🎁", nom, prix]]); sauver(); parent("Récompense ajoutée : " + nom); };
    $ecran.querySelectorAll("[data-bul]").forEach(b => b.onclick = () => bulletin(E.bulletins[+b.dataset.bul], true));
    document.getElementById("okPrenom").onclick = () => { const v = document.getElementById("champPrenom").value.trim(); if (v) { E.prenom = v; sauver(); parent("Prénom enregistré."); } };
    document.getElementById("okCode").onclick = () => { const v = document.getElementById("champCode").value.trim(); if (/^\d{4}$/.test(v)) { E.code = v; sauver(); parent("Nouveau code enregistré. Retiens-le bien."); } else parent("Le code doit faire exactement 4 chiffres."); };
    document.getElementById("okOuvert").onclick = () => { E.toutOuvert = !E.toutOuvert; sauver(); parent(E.toutOuvert ? "Toutes les étapes sont ouvertes." : "Les étapes s'ouvrent à nouveau dans l'ordre."); };
    document.getElementById("okPieces").onclick = () => { const v = parseInt(document.getElementById("champPieces").value, 10); if (v > 0 && v <= 500) { E.pieces += v; sauver(); parent(v + " pièces données."); } else parent("Indique un nombre de pièces entre 1 et 500."); };
    document.getElementById("effacer").onclick = () => { document.getElementById("confirme").hidden = false; };
    document.getElementById("non").onclick = () => { document.getElementById("confirme").hidden = true; };
    document.getElementById("oui").onclick = () => { const garde = { prenom: E.prenom, code: E.code }; E = Object.assign(defaut(), garde); sauver(); parent("Progrès effacés."); };
  }

  function resumeSemaine() {
    const ilya7 = Date.now() - 7 * 864e5;
    const parties = E.journal.filter(j => new Date(j.date).getTime() >= ilya7);
    const min = Object.entries(E.jours).filter(([j]) => new Date(j + "T12:00").getTime() >= ilya7).reduce((s, [, v]) => s + v, 0) / 60;
    const parLecon = {};
    parties.forEach(j => { if (j.ratio == null) return; (parLecon[j.id] = parLecon[j.id] || []).push(j.ratio); });
    const tous = NIVEAUX.concat([NIVEAU_BOSS]);
    const nom = id => { const n = tous.find(x => x.id === id); return n ? n.titre : null; };
    const moy = a => a.reduce((s, x) => s + x, 0) / a.length;
    const acquis = Object.keys(parLecon).filter(id => moy(parLecon[id]) >= 0.85).map(nom).filter(Boolean);
    const coince = Object.keys(parLecon).filter(id => moy(parLecon[id]) < 0.65).map(nom).filter(Boolean);
    const compte = {}; E.erreurs.forEach(x => compte[x.id] = (compte[x.id] || 0) + 1);
    const reprendre = Object.entries(compte).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, k]) => { const n = tous.find(x => x.id === id); return n ? esc(n.titre) + (n.objectif ? " (" + esc(n.objectif) + ")" : "") + " · " + k + " erreur" + (k > 1 ? "s" : "") + " à revoir" : null; }).filter(Boolean);
    const liste = a => a.length ? a.map(x => "<li>" + x + "</li>").join("") : '<li class="note">Rien pour l\'instant</li>';
    return "<h2>La semaine de " + esc(prenom()) + '</h2><div class="bloc"><div class="stat"><div><b>' + parties.length + "</b><span>parties</span></div><div><b>" + Math.round(min) + " min</b><span>de jeu</span></div><div><b>" + E.serie.n + "</b><span>jours de suite</span></div></div>" +
      '<div class="resume"><strong>✅ Acquis</strong><ul>' + liste(acquis.map(esc)) + "</ul><strong>⚠️ Ça coince</strong><ul>" + liste(coince.map(esc)) + "</ul><strong>📌 À reprendre avec " + esc(prenom()) + "</strong><ul>" + liste(reprendre) + "</ul></div></div>";
  }
  function bonsParent() {
    const att = E.bons.map((b, i) => [b, i]).filter(([b]) => b.statut === "attente");
    return '<h2>Récompenses demandées</h2><div class="bloc">' + (att.length ? "<table>" + att.map(([b, i]) => "<tr><td>" + b.e + " " + esc(b.nom) + '<br><span class="note">' + b.prix + " pièces · " + new Date(b.date).toLocaleDateString("fr-FR") + '</span></td><td><button class="petit-bouton" data-bon="' + i + ':ok">Accepter</button> <button class="petit-bouton neutre" data-bon="' + i + ':non">Refuser</button></td></tr>').join("") + "</table>" : '<p class="note">Aucune demande en attente.</p>') +
      '<details><summary>Modifier la liste des récompenses</summary><table>' + catalogue().map(([e, nom, prix], i) => "<tr><td>" + e + " " + esc(nom) + "</td><td>" + prix + ' 🪙 <button class="petit-bouton neutre" data-suppr="' + i + '">Retirer</button></td></tr>').join("") + "</table>" +
      '<div class="rangee"><input type="text" id="champBon" placeholder="Nouvelle récompense" style="flex:1;min-width:140px"><input type="text" id="champPrix" inputmode="numeric" placeholder="Prix" style="width:70px"><button class="petit-bouton" id="okBon">Ajouter</button></div></details></div>';
  }

  window.addEventListener("resize", () => { if (document.getElementById("voyage")) carte(); });
  carte();
})();
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
