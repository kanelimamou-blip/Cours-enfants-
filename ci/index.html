<style>
/* Mise en page : une seule colonne façon appli de téléphone, un écran à la fois, gros boutons à toucher. */
:root {
  --sable: #fff6e6;       /* fond, couleur sable chaud */
  --carte: #ffffff;
  --encre: #2b2118;       /* texte */
  --doux: #7a6a58;        /* texte secondaire */
  --theme: #2f6fd1;   /* couleur de l'enfant */
  --theme-clair: #d6e4fb;
  --mangue: #ffb21e;      /* étoiles et récompenses */
  --vert: #2e9e5b;        /* bonne réponse */
  --rouge: #e0533d;       /* mauvaise réponse */
  --trait: #ecdcc2;
  --titre: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --lecture: "Andika", "Segoe UI", system-ui, sans-serif; /* police pensée pour apprendre à lire */
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sable); color: var(--encre);
  font-family: var(--lecture); font-size: 18px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  overscroll-behavior: none;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sable); }
.app {
  height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 16px; box-sizing: border-box;
}
.ecran { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--theme); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--titre); margin: 0; line-height: 1.1; text-wrap: balance; }

/* En-tête */
.barre { display: flex; align-items: center; gap: 10px; }
.barre .espace { flex: 1; }
.rond { width: 48px; height: 48px; border-radius: 50%; background: var(--carte); display: grid; place-items: center; font-size: 22px; box-shadow: 0 2px 0 var(--trait); flex: none; }
.compteur { display: flex; align-items: center; gap: 6px; background: var(--carte); border-radius: 999px; padding: 6px 14px; font-family: var(--titre); font-weight: 800; font-size: 20px; box-shadow: 0 2px 0 var(--trait); font-variant-numeric: tabular-nums; }
.compteur .etoile { color: var(--mangue); }

/* Accueil */
.bonjour { display: flex; align-items: center; gap: 14px; padding: 6px 2px; }
.avatar { width: 76px; height: 76px; border-radius: 24px; background: var(--theme); display: grid; place-items: center; font-size: 44px; flex: none; transform: rotate(-4deg); }
.bonjour h1 { font-size: 32px; font-weight: 800; }
.bonjour p { margin: 2px 0 0; color: var(--doux); }
.mondes { display: grid; gap: 12px; }
.monde {
  display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 14px; text-align: left;
  background: var(--carte); border-radius: 22px; padding: 14px; box-shadow: 0 4px 0 var(--trait);
}
.monde:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--trait); }
.monde .ico { width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; font-size: 40px; }
.monde h2 { font-size: 26px; font-weight: 800; }
.monde p { margin: 2px 0 0; color: var(--doux); font-size: 15px; }
.jauge { height: 10px; border-radius: 99px; background: var(--trait); overflow: hidden; margin-top: 8px; }
.jauge i { display: block; height: 100%; background: var(--mangue); border-radius: 99px; }
.fleche { font-size: 28px; color: var(--doux); }
.palier-info { font-size: 14px; color: var(--doux); text-align: center; }

/* Parcours d'un monde */
.titre-monde { display: flex; align-items: center; gap: 12px; }
.titre-monde h1 { font-size: 30px; font-weight: 800; }
.palier-titre { font-family: var(--titre); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--doux); margin-top: 6px; }
.chemin { display: grid; gap: 10px; }
.lecon {
  display: grid; grid-template-columns: 60px 1fr auto; align-items: center; gap: 12px; text-align: left;
  background: var(--carte); border-radius: 18px; padding: 10px 14px 10px 10px; box-shadow: 0 3px 0 var(--trait);
}
.lecon .num { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: var(--theme-clair); }
.lecon.fermee { opacity: .5; }
.lecon.fermee .num { background: var(--trait); }
.lecon h3 { font-size: 20px; font-weight: 600; font-family: var(--lecture); }
.lecon .etoiles { font-size: 18px; letter-spacing: 1px; white-space: nowrap; }
.etoiles .on { color: var(--mangue); }
.etoiles .off { color: var(--trait); }

/* Leçon */
.progression { flex: 1; height: 16px; border-radius: 99px; background: var(--carte); overflow: hidden; box-shadow: inset 0 0 0 2px var(--trait); }
.progression i { display: block; height: 100%; background: var(--theme); border-radius: 99px; transition: width .3s; }
.consigne { display: flex; align-items: center; gap: 12px; }
.consigne p { margin: 0; font-size: 22px; font-weight: 700; flex: 1; }
.haut-parleur { width: 60px; height: 60px; border-radius: 50%; background: var(--theme); color: #fff; font-size: 28px; flex: none; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.haut-parleur:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.scene { background: var(--carte); border-radius: 24px; min-height: 120px; display: grid; place-items: center; padding: 16px; box-shadow: 0 4px 0 var(--trait); text-align: center; }
.scene .gros { font-size: 64px; line-height: 1.15; word-break: break-word; }
.scene .lettre { font-size: 110px; line-height: 1; font-weight: 700; }
.scene .mots { font-size: 40px; font-weight: 700; }
.scene .tas { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; font-size: 48px; max-width: 320px; }
.choix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.choix.trois { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choix.ligne { grid-template-columns: 1fr; }
.reponse {
  background: var(--carte); border-radius: 20px; min-height: 92px; padding: 10px; display: grid; place-items: center; text-align: center;
  box-shadow: 0 5px 0 var(--trait); border: 3px solid transparent; font-size: 22px; transition: transform .1s;
}
.reponse:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--trait); }
.reponse .lettre { font-size: 54px; font-weight: 700; line-height: 1; }
.reponse .emoji { font-size: 48px; line-height: 1.1; }
.reponse .tas { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 4px; font-size: 30px; }
.reponse .mots { font-size: 34px; font-weight: 700; }
.tas i { font-style: normal; }
.scene .chiffre { font-family: var(--titre); font-size: 96px; font-weight: 800; line-height: 1; }
.reponse .legende { font-size: 18px; margin-top: 4px; }
.reponse .chiffre { font-family: var(--titre); font-size: 56px; font-weight: 800; line-height: 1; }
.reponse.bon { border-color: var(--vert); background: #e6f6ec; animation: saute .4s; }
.reponse.faux { border-color: var(--rouge); background: #fdeae6; animation: secoue .4s; }
.reponse:disabled { cursor: default; }
@keyframes saute { 40% { transform: scale(1.06); } }
@keyframes secoue { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.bravo { position: fixed; inset: auto 0 calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; font-family: var(--titre); font-weight: 800; font-size: 34px; color: var(--vert); pointer-events: none; animation: monte .9s forwards; }
@keyframes monte { from { opacity: 0; transform: translateY(20px); } 30% { opacity: 1; transform: none; } to { opacity: 0; } }

/* Résultat */
.resultat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.resultat .grandes-etoiles { font-size: 64px; letter-spacing: 6px; }
.resultat h1 { font-size: 40px; font-weight: 800; }
.resultat p { margin: 0; color: var(--doux); font-size: 20px; }
.bouton { background: var(--theme); color: #fff; font-family: var(--titre); font-weight: 800; font-size: 24px; border-radius: 18px; padding: 14px 28px; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
.bouton.second { background: var(--carte); color: var(--encre); box-shadow: 0 5px 0 var(--trait); }
.bouton:active { transform: translateY(3px); }
.boutons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

/* Espace parent */
.pave { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; justify-content: center; }
.pave button { height: 64px; border-radius: 16px; background: var(--carte); font-family: var(--titre); font-size: 28px; font-weight: 800; box-shadow: 0 3px 0 var(--trait); }
.points { display: flex; gap: 12px; justify-content: center; }
.points i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--doux); }
.points i.plein { background: var(--encre); border-color: var(--encre); }
.parent { font-family: system-ui, sans-serif; font-size: 16px; user-select: text; -webkit-user-select: text; }
.parent h1 { font-size: 26px; }
.parent h2 { font-size: 19px; margin-top: 8px; }
.bloc { background: var(--carte); border-radius: 16px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 2px 0 var(--trait); }
.bloc table { width: 100%; border-collapse: collapse; font-size: 15px; }
.bloc td { padding: 6px 4px; border-top: 1px solid var(--trait); vertical-align: top; }
.bloc td:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bloc tr:first-child td { border-top: 0; }
.rangee { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rangee label { flex: 1; min-width: 160px; }
.rangee input[type=text], .rangee input[type=password] { font: inherit; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--trait); width: 140px; background: var(--sable); color: var(--encre); }
.petit-bouton { background: var(--theme); color: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 700; }
.petit-bouton.danger { background: var(--rouge); }
.petit-bouton.neutre { background: var(--trait); color: var(--encre); }
.note { color: var(--doux); font-size: 14px; margin: 0; }
.stat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
.stat b { display: block; font-family: var(--titre); font-size: 28px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--doux); }
.discret { font-size: 13px; color: var(--doux); text-align: center; padding: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
/* ---------- Contenu propre à l'enfant ---------- */
/* Contenu de l'appli CI. Programme sénégalais (CEB, étape 1), palier 1 : début d'année. */
(function () {
  const hasard = a => a[Math.floor(Math.random() * a.length)];
  const melange = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const tirer = (a, n) => melange(a).slice(0, n);
  const fois = (n, f) => Array.from({ length: n }, (_, i) => f(i));
  const de = mot => (/^[aeiouyéèêœh]/i.test(mot) ? "d'" : "de ") + mot;
  const NOMBRES = ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix"];

  // Une question à choix : la bonne réponse est toujours la première, le moteur mélange.
  function q(consigne, scene, bonne, autres, extra) {
    return Object.assign({ consigne, scene, choix: [bonne].concat(autres), bonne: 0 }, extra || {});
  }

  // ---------- LIRE ----------
  const VOYELLES = ["a", "i", "o", "u", "e", "é"];
  const SON = { a: "a", i: "i", o: "o", u: "u", e: "e", "é": "é" };
  function lettre(l) { return { k: "lettre", t: l, dire: "la lettre " + SON[l] }; }

  function reconnaitre(cibles, total) {
    return () => fois(8, i => {
      const c = cibles[i % cibles.length];
      const autres = tirer(total.filter(x => x !== c), 3);
      return q("Touche la lettre " + c, null, lettre(c), autres.map(lettre), { dire: "Touche la lettre " + SON[c] + "." });
    });
  }

  // Mots illustrés : chaque mot liste les sons de voyelle qu'on y entend.
  const MOTS = [
    ["chat", "🐈", "a"], ["ananas", "🍍", "a"], ["avion", "✈️", "a"], ["sac", "👜", "a"], ["vache", "🐄", "a"], ["banane", "🍌", "a"],
    ["riz", "🍚", "i"], ["lit", "🛏️", "i"], ["tigre", "🐯", "i"], ["girafe", "🦒", "ia"], ["piment", "🌶️", "i"],
    ["moto", "🏍️", "o"], ["robe", "👗", "o"], ["os", "🦴", "o"], ["pomme", "🍎", "o"], ["stylo", "🖊️", "io"],
    ["lune", "🌙", "u"], ["bus", "🚌", "u"], ["jus", "🧃", "u"], ["tortue", "🐢", "ou"], ["plume", "🪶", "u"],
    ["bébé", "👶", "é"], ["café", "☕", "aé"], ["vélo", "🚲", "éo"], ["école", "🏫", "éo"], ["éléphant", "🐘", "é"],
  ].map(([mot, e, sons]) => ({ mot, e, sons }));
  const image = m => ({ k: "image", e: m.e, t: m.mot, dire: m.mot });

  function entendre(sons) {
    return () => fois(8, i => {
      const s = sons[i % sons.length];
      const avec = MOTS.filter(m => m.sons.includes(s));
      const sans = MOTS.filter(m => !m.sons.includes(s) && !(s === "u" && m.mot.includes("u")) && !(s === "o" && m.mot.includes("ou")));
      return q("Dans quel mot entends-tu « " + s + " » ?", { k: "lettre", t: s }, image(hasard(avec)), tirer(sans, 2).map(image),
        { dire: "Dans quel mot entends-tu le son " + SON[s] + " ? Écoute bien." });
    });
  }

  function syllabes(cons, deja) {
    const syl = c => VOYELLES.map(v => c + v);
    return () => {
      const toutes = deja.concat([cons]).flatMap(syl);
      const miennes = syl(cons);
      return fois(8, i => {
        if (i % 2 === 0) {
          const s = hasard(miennes);
          return q("Touche la syllabe que tu entends", null, { k: "lettre", t: s, dire: s }, tirer(toutes.filter(x => x !== s), 3).map(x => ({ k: "lettre", t: x, dire: x })), { dire: "Touche : " + s + "." });
        }
        const v = hasard(VOYELLES), s = cons + v;
        return q(cons + " et " + v + ", ça fait…", { k: "mots", t: cons + " + " + v }, { k: "lettre", t: s, dire: s },
          tirer(miennes.filter(x => x !== s), 2).map(x => ({ k: "lettre", t: x, dire: x })), { dire: "La lettre " + cons + " avec " + SON[v] + ", ça fait quoi ?" });
      });
    };
  }

  const PETITS_MOTS = [["ami", "🧒"], ["lama", "🦙"], ["mamie", "👵"], ["mule", "🫏"], ["lime", "🪚"], ["mimi", "🐱"], ["la", ""], ["le", ""], ["ma", ""], ["mollo", ""]];
  function lireMots() {
    const ecrits = PETITS_MOTS.map(m => m[0]);
    return () => tirer(PETITS_MOTS.slice(0, 6), 6).concat(tirer(PETITS_MOTS.slice(6, 9), 2)).map(([m]) =>
      q("Touche le mot que tu entends", null, { k: "mots", t: m, dire: m }, tirer(ecrits.filter(x => x !== m), 2).map(x => ({ k: "mots", t: x, dire: x })), { dire: "Touche le mot : " + m + "." , disposition: "ligne" }));
  }

  // ---------- COMPTER ----------
  const OBJETS = [["mangue", "mangues", "🥭"], ["poisson", "poissons", "🐟"], ["chèvre", "chèvres", "🐐"], ["ballon", "ballons", "⚽"], ["arachide", "arachides", "🥜"], ["œuf", "œufs", "🥚"], ["étoile", "étoiles", "⭐"]];
  const tas = (n, e) => ({ k: "tas", items: fois(n, () => e) });
  const chiffre = n => ({ k: "chiffre", t: String(n), dire: NOMBRES[n] });

  function compter(min, max) {
    return () => fois(8, () => {
      const n = min + Math.floor(Math.random() * (max - min + 1));
      const [, pl, e] = hasard(OBJETS);
      const autres = tirer(fois(max - min + 3, i => Math.max(1, min - 1) + i).filter(x => x !== n && x > 0 && x <= 10), 2);
      return q("Combien " + de(pl) + " ?", tas(n, e), chiffre(n), autres.map(chiffre), { dire: "Compte bien. Combien " + de(pl) + " ?" });
    });
  }

  function nombres1a5() {
    return () => fois(8, i => {
      const n = 1 + Math.floor(Math.random() * 5);
      const autres = tirer([1, 2, 3, 4, 5].filter(x => x !== n), 2);
      if (i % 2 === 0) return q("Touche le nombre " + NOMBRES[n], null, chiffre(n), autres.map(chiffre), { dire: "Touche le nombre " + NOMBRES[n] + "." });
      const [, pl, e] = hasard(OBJETS);
      return q("Où y a-t-il " + n + " " + (n > 1 ? pl : OBJETS.find(o => o[2] === e)[0]) + " ?", chiffre(n), tas(n, e), autres.map(x => tas(x, e)),
        { dire: "Trouve le groupe où il y en a " + NOMBRES[n] + ".", disposition: "trois" });
    });
  }

  function plusMoins() {
    return () => fois(8, i => {
      const [, pl, e] = hasard(OBJETS);
      const a = 1 + Math.floor(Math.random() * 7);
      let b; do { b = 1 + Math.floor(Math.random() * 7); } while (Math.abs(a - b) < 2);
      const grand = Math.max(a, b), petit = Math.min(a, b);
      if (i % 3 === 2) {
        const n = 2 + Math.floor(Math.random() * 5);
        return q("Touche le groupe qui en a autant", tas(n, e), tas(n, e), [tas(n + 2, e), tas(Math.max(1, n - 1), e)], { dire: "Regarde bien. Touche le groupe où il y en a autant." });
      }
      return i % 3 === 0
        ? q("Où y a-t-il le plus " + de(pl) + " ?", null, tas(grand, e), [tas(petit, e)], { dire: "Où y a-t-il le plus " + de(pl) + " ?" })
        : q("Où y a-t-il le moins " + de(pl) + " ?", null, tas(petit, e), [tas(grand, e)], { dire: "Où y a-t-il le moins " + de(pl) + " ?" });
    });
  }

  const FORMES = {
    rond: '<svg viewBox="0 0 100 100" width="76" height="76" aria-label="rond"><circle cx="50" cy="50" r="40" fill="#3b82c4"/></svg>',
    carré: '<svg viewBox="0 0 100 100" width="76" height="76" aria-label="carré"><rect x="14" y="14" width="72" height="72" fill="#e0533d"/></svg>',
    triangle: '<svg viewBox="0 0 100 100" width="76" height="76" aria-label="triangle"><polygon points="50,10 92,88 8,88" fill="#2e9e5b"/></svg>',
    rectangle: '<svg viewBox="0 0 100 100" width="76" height="76" aria-label="rectangle"><rect x="4" y="28" width="92" height="44" fill="#f0a020"/></svg>',
  };
  function formes() {
    const noms = Object.keys(FORMES);
    const forme = n => ({ k: "html", html: FORMES[n], dire: "un " + n });
    return () => fois(8, i => {
      const n = noms[i % noms.length];
      return i < 4
        ? q("Touche le " + n, null, forme(n), noms.filter(x => x !== n).slice(0, 3).map(forme), { dire: "Touche le " + n + "." })
        : q("Comment s'appelle cette forme ?", forme(noms[(i + 1) % 4]), { k: "mots", t: noms[(i + 1) % 4], dire: noms[(i + 1) % 4] },
            tirer(noms.filter(x => x !== noms[(i + 1) % 4]), 2).map(x => ({ k: "mots", t: x, dire: x })), { dire: "Comment s'appelle cette forme ?", disposition: "ligne" });
    });
  }

  function grandPetit() {
    const taille = (e, px) => ({ k: "html", html: '<span style="font-size:' + px + 'px;line-height:1">' + e + "</span>" });
    return () => fois(8, i => {
      const [s, , e] = hasard(OBJETS);
      const tailles = [26, 44, 70];
      const plusGrand = i % 2 === 0;
      return q("Touche " + (plusGrand ? "le plus grand" : "le plus petit"), null, taille(e, plusGrand ? 70 : 26), (plusGrand ? [26, 44] : [44, 70]).map(t => taille(e, t)),
        { dire: "Touche " + (plusGrand ? "le plus grand." : "le plus petit."), disposition: "trois" });
    });
  }

  // ---------- DÉCOUVRIR ----------
  function imagier(liste, consigne, n) {
    // liste : [nom, emoji, article]
    return () => tirer(liste, Math.min(8, liste.length)).concat(tirer(liste, 8)).slice(0, n || 8).map(([nom, e, art]) =>
      q(consigne + " " + art + nom, null, { k: "image", e, dire: art + nom }, tirer(liste.filter(x => x[0] !== nom), 2).map(([n2, e2, a2]) => ({ k: "image", e: e2, dire: a2 + n2 })),
        { dire: consigne + " " + art + nom + ".", disposition: "trois" }));
  }
  const CORPS = [["yeux", "👀", "les "], ["oreille", "👂", "l'"], ["nez", "👃", "le "], ["bouche", "👄", "la "], ["main", "✋", "la "], ["pied", "🦶", "le "], ["dents", "🦷", "les "], ["cheveux", "💇", "les "]];
  const ECOLE = [["cartable", "🎒", "le "], ["crayon", "✏️", "le "], ["règle", "📏", "la "], ["livre", "📕", "le "], ["ciseaux", "✂️", "les "], ["cahier", "📒", "le "], ["craie", "🖍️", "la "], ["école", "🏫", "l'"]];
  const FAMILLE = [["papa", "👨🏾", ""], ["maman", "👩🏾", ""], ["grand-père", "👴🏾", "le "], ["grand-mère", "👵🏾", "la "], ["bébé", "👶🏾", "le "], ["frère", "👦🏾", "le "], ["sœur", "👧🏾", "la "]];

  function sens() {
    const SENS = [["Avec quoi je vois ?", "👀", "les yeux"], ["Avec quoi j'entends ?", "👂", "les oreilles"], ["Avec quoi je sens les odeurs ?", "👃", "le nez"], ["Avec quoi je goûte ?", "👅", "la langue"], ["Avec quoi je touche ?", "✋", "les mains"]];
    return () => fois(8, i => {
      const [question, e, nom] = SENS[i % SENS.length];
      return q(question, null, { k: "image", e, dire: nom }, tirer(SENS.filter(s => s[1] !== e), 2).map(s => ({ k: "image", e: s[1], dire: s[2] })), { dire: question, disposition: "trois" });
    });
  }

  function hygiene() {
    const BONS = [
      ["Avant de manger, je…", ["🧼", "me lave les mains"], [["📺", "regarde la télé"], ["⚽", "joue au ballon"]]],
      ["Après les toilettes, je…", ["🧼", "me lave les mains"], [["🍬", "mange un bonbon"], ["🛏️", "vais au lit"]]],
      ["Le matin et le soir, je…", ["🪥", "me brosse les dents"], [["🍭", "mange des sucreries"], ["📱", "joue au téléphone"]]],
      ["Pour être propre, chaque jour je…", ["🚿", "me lave"], [["🧦", "garde mes chaussettes"], ["😴", "dors"]]],
      ["Pour boire, je prends…", ["🚰", "de l'eau propre"], [["🌧️", "l'eau de la flaque"], ["🪣", "l'eau du seau sale"]]],
      ["Quand j'éternue, je…", ["💪🏾", "mets mon coude"], [["🗣️", "éternue sur mon ami"], ["🍽️", "éternue sur le plat"]]],
      ["Je jette mes papiers…", ["🗑️", "dans la poubelle"], [["🛣️", "dans la rue"], ["🏫", "dans la classe"]]],
      ["Avant de manger une mangue, je…", ["💧", "la lave"], [["🦶", "la pose par terre"], ["🐐", "la donne à la chèvre"]]],
    ];
    const item = ([e, t]) => ({ k: "image", e, t, dire: t });
    return () => melange(BONS).map(([consigne, bon, mauvais]) => q(consigne, null, item(bon), mauvais.map(item), { disposition: "ligne", dire: consigne.replace("…", "") + " quoi ?" }));
  }

  window.CONTENU = {
    id: "ci",
    titreAppli: "Mon école CI",
    version: "Palier 1",
    prenom: "Champion",
    classe: "Cours d'Initiation",
    avatar: "🦁",
    paliers: [{ id: "p1", titre: "Palier 1", periode: "octobre à décembre" }],
    mondes: [
      { id: "lire", titre: "Lire", icone: "📖", couleur: "#ffd9a8", lecons: [
        { id: "ci-p1-l1", palier: "p1", icone: "a", titre: "Les voyelles a, i, o", objectif: "Reconnaître les lettres a, i, o", questions: reconnaitre(["a", "i", "o"], ["a", "i", "o", "u", "e"]) },
        { id: "ci-p1-l2", palier: "p1", icone: "u", titre: "Les voyelles u, e, é", objectif: "Reconnaître toutes les voyelles", questions: reconnaitre(["u", "e", "é"], VOYELLES) },
        { id: "ci-p1-l3", palier: "p1", icone: "👂", titre: "J'entends a, i, o", objectif: "Repérer un son de voyelle dans un mot", questions: entendre(["a", "i", "o"]) },
        { id: "ci-p1-l4", palier: "p1", icone: "👂", titre: "J'entends u et é", objectif: "Repérer un son de voyelle dans un mot", questions: entendre(["u", "é"]) },
        { id: "ci-p1-l5", palier: "p1", icone: "l", titre: "La lettre l : la, li, lo", objectif: "Lire les syllabes avec l", questions: syllabes("l", []) },
        { id: "ci-p1-l6", palier: "p1", icone: "m", titre: "La lettre m : ma, mi, mo", objectif: "Lire les syllabes avec m", questions: syllabes("m", ["l"]) },
        { id: "ci-p1-l7", palier: "p1", icone: "📝", titre: "Je lis mes premiers mots", objectif: "Lire des mots avec l, m et les voyelles", questions: lireMots() },
      ] },
      { id: "compter", titre: "Compter", icone: "🔢", couleur: "#bfe3c9", lecons: [
        { id: "ci-p1-c1", palier: "p1", icone: "🥭", titre: "Je compte jusqu'à 5", objectif: "Dénombrer une collection de 1 à 5", questions: compter(1, 5) },
        { id: "ci-p1-c2", palier: "p1", icone: "5", titre: "Les nombres de 1 à 5", objectif: "Associer le nombre et la quantité", questions: nombres1a5() },
        { id: "ci-p1-c3", palier: "p1", icone: "⚖️", titre: "Plus, moins, autant", objectif: "Comparer deux collections", questions: plusMoins() },
        { id: "ci-p1-c4", palier: "p1", icone: "🐟", titre: "Je compte jusqu'à 9", objectif: "Dénombrer une collection de 6 à 9", questions: compter(6, 9) },
        { id: "ci-p1-c5", palier: "p1", icone: "🔺", titre: "Les formes", objectif: "Reconnaître rond, carré, triangle, rectangle", questions: formes() },
        { id: "ci-p1-c6", palier: "p1", icone: "🐘", titre: "Grand et petit", objectif: "Comparer des tailles", questions: grandPetit() },
      ] },
      { id: "decouvrir", titre: "Découvrir", icone: "🌍", couleur: "#bcdcf5", lecons: [
        { id: "ci-p1-d1", palier: "p1", icone: "🧍🏾", titre: "Mon corps", objectif: "Nommer les parties du corps", questions: imagier(CORPS, "Touche") },
        { id: "ci-p1-d2", palier: "p1", icone: "👀", titre: "Mes cinq sens", objectif: "Associer chaque sens à un organe", questions: sens() },
        { id: "ci-p1-d3", palier: "p1", icone: "🧼", titre: "Je suis propre", objectif: "Connaître les gestes d'hygiène", questions: hygiene() },
        { id: "ci-p1-d4", palier: "p1", icone: "🎒", titre: "Ma classe", objectif: "Nommer le matériel de l'école", questions: imagier(ECOLE, "Touche") },
        { id: "ci-p1-d5", palier: "p1", icone: "👨‍👩‍👧", titre: "Ma famille", objectif: "Nommer les membres de la famille", questions: imagier(FAMILLE, "Touche") },
      ] },
    ],
  };
})();

</script>
<script>
/* ---------- Moteur commun aux trois applis ---------- */
(function () {
  const C = window.CONTENU;
  const CLE = "coursEnfants:" + C.id;
  const $ecran = document.getElementById("ecran");

  // ----- Mémoire du téléphone -----
  const defaut = () => ({ prenom: C.prenom, code: "1234", toutOuvert: false, progres: {}, journal: [], jours: {} });
  let E = defaut();
  try { const brut = localStorage.getItem(CLE); if (brut) E = Object.assign(defaut(), JSON.parse(brut)); } catch (e) {}
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }

  // Temps passé dans l'appli, compté seulement quand l'écran est visible
  const aujourdhui = () => new Date().toISOString().slice(0, 10);
  setInterval(() => {
    if (document.visibilityState !== "visible") return;
    const j = aujourdhui();
    E.jours[j] = (E.jours[j] || 0) + 15;
    const cles = Object.keys(E.jours).sort();
    while (cles.length > 30) delete E.jours[cles.shift()];
    sauver();
  }, 15000);

  // ----- Voix -----
  let voix = null;
  const parole = "speechSynthesis" in window ? window.speechSynthesis : null;
  function choisirVoix() {
    if (!parole) return;
    const v = parole.getVoices().filter(v => /^fr/i.test(v.lang));
    voix = v.find(v => /fr[-_]FR/i.test(v.lang) && /google|natural|amélie|audrey|thomas/i.test(v.name)) || v.find(v => /fr[-_]FR/i.test(v.lang)) || v[0] || null;
  }
  if (parole) { choisirVoix(); parole.onvoiceschanged = choisirVoix; }
  function dire(texte) {
    if (!parole || !texte) return;
    try {
      parole.cancel();
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = "fr-FR"; u.rate = 0.85; u.pitch = 1.05;
      if (voix) u.voice = voix;
      parole.speak(u);
    } catch (e) {}
  }

  // ----- Outils -----
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const melange = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const etoilesHTML = (n, max = 3) => '<span class="etoiles" aria-label="' + n + ' étoiles sur ' + max + '">' + Array.from({ length: max }, (_, i) => '<span class="' + (i < n ? "on" : "off") + '">★</span>').join("") + "</span>";
  const toutesLecons = () => C.mondes.flatMap(m => m.lecons.map(l => Object.assign({ monde: m }, l)));
  const totalEtoiles = () => Object.values(E.progres).reduce((s, p) => s + (p.etoiles || 0), 0);
  function ouverte(monde, i) {
    if (E.toutOuvert || i === 0) return true;
    const prec = monde.lecons[i - 1];
    return !!(E.progres[prec.id] && E.progres[prec.id].etoiles > 0);
  }

  // Affichage d'un élément (scène ou réponse)
  function rendu(x) {
    if (x == null) return "";
    if (typeof x === "string") return '<span class="gros">' + esc(x) + "</span>";
    switch (x.k) {
      case "lettre": return '<span class="lettre">' + esc(x.t) + "</span>";
      case "mots": return '<span class="mots">' + esc(x.t) + "</span>";
      case "chiffre": return '<span class="chiffre">' + esc(x.t) + "</span>";
      case "tas": return '<span class="tas">' + x.items.map(e => "<i>" + esc(e) + "</i>").join("") + "</span>";
      case "html": return x.html;
      case "image": return '<span class="emoji">' + esc(x.e) + '</span>' + (x.t ? '<span class="legende">' + esc(x.t) + "</span>" : "");
      default: return '<span class="gros">' + esc(x.t || "") + "</span>";
    }
  }

  // ----- Écrans -----
  function accueil() {
    const total = totalEtoiles();
    $ecran.innerHTML =
      '<div class="barre"><div class="compteur"><span class="etoile">★</span>' + total + '</div><span class="espace"></span>' +
      '<button class="rond" id="btnParent" aria-label="Espace parent">🔒</button></div>' +
      '<div class="bonjour"><div class="avatar" aria-hidden="true">' + C.avatar + '</div><div><h1>Bonjour ' + esc(E.prenom) + ' !</h1><p>' + esc(C.classe) + ' · Que veux-tu apprendre ?</p></div></div>' +
      '<div class="mondes">' + C.mondes.map((m, i) => {
        const faites = m.lecons.filter(l => E.progres[l.id] && E.progres[l.id].etoiles > 0).length;
        return '<button class="monde" data-i="' + i + '"><span class="ico" style="background:' + m.couleur + '">' + m.icone + '</span>' +
          '<span><h2>' + esc(m.titre) + '</h2><p>' + faites + ' leçon' + (faites > 1 ? "s" : "") + ' sur ' + m.lecons.length + '</p>' +
          '<span class="jauge"><i style="width:' + Math.round(100 * faites / m.lecons.length) + '%"></i></span></span><span class="fleche">›</span></button>';
      }).join("") + '</div>' +
      '<p class="palier-info">' + esc(C.paliers.map(p => p.titre + " : " + p.periode).join(" · ")) + '</p>';
    $ecran.querySelectorAll(".monde").forEach(b => b.onclick = () => { const m = C.mondes[+b.dataset.i]; dire(m.titre); voirMonde(m); });
    document.getElementById("btnParent").onclick = () => codeParent();
  }

  function voirMonde(m) {
    let html = '<div class="barre"><button class="rond" id="retour" aria-label="Retour">←</button><span class="espace"></span><div class="compteur"><span class="etoile">★</span>' + totalEtoiles() + '</div></div>' +
      '<div class="titre-monde"><span class="avatar" style="background:' + m.couleur + ';width:60px;height:60px;font-size:34px;border-radius:18px">' + m.icone + '</span><h1>' + esc(m.titre) + '</h1></div>';
    C.paliers.forEach(p => {
      const lecons = m.lecons.map((l, i) => ({ l, i })).filter(x => x.l.palier === p.id);
      if (!lecons.length) return;
      html += '<div class="palier-titre">' + esc(p.titre) + '</div><div class="chemin">' + lecons.map(({ l, i }) => {
        const ok = ouverte(m, i), pr = E.progres[l.id];
        return '<button class="lecon' + (ok ? "" : " fermee") + '" data-i="' + i + '"' + (ok ? "" : ' aria-disabled="true"') + '>' +
          '<span class="num">' + (ok ? l.icone : "🔒") + '</span><span><h3>' + esc(l.titre) + '</h3></span>' + etoilesHTML(pr ? pr.etoiles : 0) + '</button>';
      }).join("") + '</div>';
    });
    $ecran.innerHTML = html;
    $ecran.scrollTop = 0;
    document.getElementById("retour").onclick = accueil;
    $ecran.querySelectorAll(".lecon").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (!ouverte(m, i)) { dire("Termine d'abord la leçon d'avant."); return; }
      lancer(m, m.lecons[i]);
    });
  }

  function lancer(m, l) {
    const questions = l.questions().slice(0, 8);
    let n = 0, justes = 0;
    function poser() {
      const q = questions[n];
      const ordre = q.fixe ? q.choix.map((c, i) => i) : melange(q.choix.map((c, i) => i));
      const nb = q.choix.length;
      const classe = q.disposition || (nb === 3 ? "trois" : "");
      let premierEssai = true;
      $ecran.innerHTML =
        '<div class="barre"><button class="rond" id="quitter" aria-label="Quitter la leçon">✕</button><div class="progression"><i style="width:' + Math.round(100 * n / questions.length) + '%"></i></div></div>' +
        '<div class="consigne"><button class="haut-parleur" id="ecouter" aria-label="Écouter la consigne">🔊</button><p>' + esc(q.consigne) + '</p></div>' +
        (q.scene ? '<div class="scene">' + rendu(q.scene) + '</div>' : "") +
        '<div class="choix ' + classe + '">' + ordre.map(i => '<button class="reponse" data-i="' + i + '">' + rendu(q.choix[i]) + '</button>').join("") + '</div>';
      const ecoute = () => dire(q.dire || q.consigne);
      document.getElementById("ecouter").onclick = ecoute;
      document.getElementById("quitter").onclick = () => voirMonde(m);
      ecoute();
      $ecran.querySelectorAll(".reponse").forEach(b => b.onclick = () => {
        const i = +b.dataset.i;
        if (i === q.bonne) {
          b.classList.add("bon");
          if (premierEssai) justes++;
          $ecran.querySelectorAll(".reponse").forEach(x => x.disabled = true);
          const mot = ["Bravo !", "Super !", "Très bien !", "Génial !", "Excellent !"][Math.floor(Math.random() * 5)];
          dire(mot);
          const t = document.createElement("div"); t.className = "bravo"; t.textContent = mot; document.body.appendChild(t);
          setTimeout(() => { t.remove(); n++; n < questions.length ? poser() : fin(); }, 1100);
        } else {
          premierEssai = false;
          b.classList.add("faux"); b.disabled = true;
          const c = q.choix[i];
          dire("Essaie encore." + (c && c.dire ? " Ça, c'est " + c.dire + "." : ""));
        }
      });
    }
    function fin() {
      const ratio = justes / questions.length;
      const etoiles = ratio >= 0.9 ? 3 : ratio >= 0.65 ? 2 : 1;
      const avant = E.progres[l.id] || { etoiles: 0, fois: 0 };
      E.progres[l.id] = { etoiles: Math.max(avant.etoiles, etoiles), fois: (avant.fois || 0) + 1, dernier: justes + "/" + questions.length, date: new Date().toISOString() };
      E.journal.unshift({ id: l.id, score: justes + "/" + questions.length, date: new Date().toISOString() });
      E.journal = E.journal.slice(0, 60);
      sauver();
      const mots = ["Continue, tu vas y arriver !", "Bien joué !", "Bravo, champion !"];
      dire(mots[etoiles - 1] + " Tu as gagné " + etoiles + " étoile" + (etoiles > 1 ? "s" : "") + ".");
      $ecran.innerHTML = '<div class="resultat"><div class="grandes-etoiles">' + etoilesHTML(etoiles) + '</div><h1>' + esc(mots[etoiles - 1]) + '</h1>' +
        '<p>' + justes + ' bonne' + (justes > 1 ? "s" : "") + ' réponse' + (justes > 1 ? "s" : "") + ' du premier coup sur ' + questions.length + '</p>' +
        '<div class="boutons"><button class="bouton second" id="encore">Recommencer</button><button class="bouton" id="suite">Continuer</button></div></div>';
      document.getElementById("encore").onclick = () => lancer(m, l);
      document.getElementById("suite").onclick = () => voirMonde(m);
    }
    poser();
  }

  // ----- Espace parent -----
  function codeParent() {
    let saisie = "";
    function dessiner() {
      $ecran.innerHTML = '<div class="barre"><button class="rond" id="retour" aria-label="Retour">←</button></div>' +
        '<div class="resultat" style="justify-content:flex-start;padding-top:20px"><h1 style="font-size:28px">Espace parent</h1><p>Tape le code parent</p>' +
        '<div class="points">' + [0, 1, 2, 3].map(i => '<i class="' + (i < saisie.length ? "plein" : "") + '"></i>').join("") + '</div>' +
        '<div class="pave">' + [1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"].map(c => c === "" ? "<span></span>" : '<button data-c="' + c + '">' + c + '</button>').join("") + '</div></div>';
      document.getElementById("retour").onclick = accueil;
      $ecran.querySelectorAll(".pave button").forEach(b => b.onclick = () => {
        const c = b.dataset.c;
        if (c === "⌫") saisie = saisie.slice(0, -1); else if (saisie.length < 4) saisie += c;
        if (saisie.length === 4) {
          if (saisie === E.code) return parent();
          saisie = ""; dessiner(); $ecran.querySelector(".points").style.animation = "secoue .4s"; return;
        }
        dessiner();
      });
    }
    dessiner();
  }

  function parent(message) {
    const lecons = toutesLecons();
    const faites = lecons.filter(l => E.progres[l.id] && E.progres[l.id].etoiles > 0).length;
    const jours = Object.keys(E.jours).sort().reverse().slice(0, 7);
    const minutes = s => Math.round((s || 0) / 60);
    const nomLecon = id => { const l = lecons.find(x => x.id === id); return l ? l.monde.titre + " · " + l.titre : id; };
    const dateCourte = d => new Date(d).toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    $ecran.innerHTML = '<div class="parent" style="display:grid;gap:12px">' +
      '<div class="barre"><button class="rond" id="retour" aria-label="Retour">←</button><h1>Espace parent</h1></div>' +
      (message ? '<p class="note" style="color:var(--vert);font-weight:700">' + esc(message) + '</p>' : "") +
      '<div class="bloc"><div class="stat"><div><b>' + faites + '/' + lecons.length + '</b><span>leçons réussies</span></div><div><b>' + totalEtoiles() + '</b><span>étoiles</span></div><div><b>' + minutes(E.jours[aujourdhui()]) + ' min</b><span>aujourd\'hui</span></div></div></div>' +
      '<h2>Progrès par leçon</h2>' +
      C.mondes.map(m => '<div class="bloc"><strong>' + m.icone + ' ' + esc(m.titre) + '</strong><table>' + m.lecons.map(l => {
        const p = E.progres[l.id];
        return '<tr><td>' + esc(l.titre) + (l.objectif ? '<br><span class="note">' + esc(l.objectif) + '</span>' : "") + '</td><td>' + (p ? etoilesHTML(p.etoiles) + '<br><span class="note">' + p.dernier + ' · ' + p.fois + ' fois</span>' : '<span class="note">pas encore</span>') + '</td></tr>';
      }).join("") + '</table></div>').join("") +
      '<h2>Dernières activités</h2><div class="bloc"><table>' + (E.journal.length ? E.journal.slice(0, 12).map(j => '<tr><td>' + esc(nomLecon(j.id)) + '<br><span class="note">' + dateCourte(j.date) + '</span></td><td>' + j.score + '</td></tr>').join("") : '<tr><td class="note">Aucune leçon faite pour l\'instant.</td><td></td></tr>') + '</table></div>' +
      '<h2>Temps passé dans l\'appli</h2><div class="bloc"><table>' + (jours.length ? jours.map(j => '<tr><td>' + new Date(j + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }) + '</td><td>' + minutes(E.jours[j]) + ' min</td></tr>').join("") : '<tr><td class="note">Pas encore de temps enregistré.</td><td></td></tr>') + '</table>' +
      '<p class="note">Pour limiter le temps d\'écran depuis ton téléphone, utilise Google Family Link.</p></div>' +
      '<h2>Réglages</h2><div class="bloc">' +
      '<div class="rangee"><label for="champPrenom">Prénom affiché</label><input type="text" id="champPrenom" value="' + esc(E.prenom) + '" maxlength="20"><button class="petit-bouton" id="okPrenom">Enregistrer</button></div>' +
      '<div class="rangee"><label for="champCode">Nouveau code parent (4 chiffres)</label><input type="password" id="champCode" inputmode="numeric" maxlength="4" placeholder="••••"><button class="petit-bouton" id="okCode">Changer</button></div>' +
      '<div class="rangee"><label>Ouvrir toutes les leçons sans suivre l\'ordre</label><button class="petit-bouton ' + (E.toutOuvert ? "" : "neutre") + '" id="okOuvert">' + (E.toutOuvert ? "Activé" : "Désactivé") + '</button></div>' +
      '<div class="rangee"><label>Effacer tous les progrès de ce téléphone</label><button class="petit-bouton danger" id="effacer">Effacer</button></div>' +
      '<div id="confirme" hidden class="rangee"><label><strong>Sûr ? Les étoiles et l\'historique seront perdus.</strong></label><button class="petit-bouton neutre" id="non">Annuler</button><button class="petit-bouton danger" id="oui">Oui, effacer</button></div>' +
      '</div>' + (E.code === "1234" ? '<p class="note">Le code est encore 1234. Change-le pour que les enfants ne puissent pas entrer ici.</p>' : "") +
      '<p class="discret">' + esc(C.titreAppli) + ' · ' + esc(C.version) + '</p></div>';
    $ecran.scrollTop = 0;
    document.getElementById("retour").onclick = accueil;
    document.getElementById("okPrenom").onclick = () => { const v = document.getElementById("champPrenom").value.trim(); if (v) { E.prenom = v; sauver(); parent("Prénom enregistré."); } };
    document.getElementById("okCode").onclick = () => { const v = document.getElementById("champCode").value.trim(); if (/^\d{4}$/.test(v)) { E.code = v; sauver(); parent("Nouveau code enregistré. Retiens-le bien."); } else parent("Le code doit faire exactement 4 chiffres."); };
    document.getElementById("okOuvert").onclick = () => { E.toutOuvert = !E.toutOuvert; sauver(); parent(E.toutOuvert ? "Toutes les leçons sont ouvertes." : "Les leçons s'ouvrent à nouveau dans l'ordre."); };
    document.getElementById("effacer").onclick = () => { document.getElementById("confirme").hidden = false; };
    document.getElementById("non").onclick = () => { document.getElementById("confirme").hidden = true; };
    document.getElementById("oui").onclick = () => { E.progres = {}; E.journal = []; E.jours = {}; sauver(); parent("Progrès effacés."); };
  }

  accueil();
})();
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
