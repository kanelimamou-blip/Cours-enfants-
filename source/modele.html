      '<div class="rangee"><label>Ouvrir toutes les étapes sans suivre l\'ordre</label><button class="petit-bouton ' + (E.toutOuvert ? "" : "neutre") + '" id="okOuvert">' + (E.toutOuvert ? "Activé" : "Désactivé") + "</button></div>" +
      '<div class="rangee"><label for="champPieces">Donner des pièces en récompense</label><input type="text" id="champPieces" inputmode="numeric" maxlength="3" placeholder="20"><button class="petit-bouton" id="okPieces">Donner</button></div>' +
      '<div class="rangee"><label for="champAnniv">Date d\'anniversaire de ' + esc(prenom()) + '</label><input type="date" id="champAnniv" value="' + (E.anniv ? "2018-" + E.anniv : "") + '" style="width:160px"><button class="petit-bouton" id="okAnniv">Enregistrer</button></div>' +
      '<div class="rangee"><label>Mode du soir (couleurs douces)</label><button class="petit-bouton neutre" id="okSoir">' + ({ auto: "Auto, de 19 h à 7 h", oui: "Toujours", non: "Jamais" })[E.reglages.soir] + "</button></div>" +
      '<div class="rangee"><label>Taille du texte</label><button class="petit-bouton neutre" id="okTaille">' + ["Normale", "Grande", "Très grande"][E.reglages.taille] + "</button></div>" +
      '<div class="rangee"><label>Police plus facile à lire</label><button class="petit-bouton ' + (E.reglages.police ? "" : "neutre") + '" id="okPolice">' + (E.reglages.police ? "Activée" : "Désactivée") + "</button></div>" +
      '<div class="rangee"><label>Sauvegarde des progrès (pour changer de téléphone)</label><button class="petit-bouton" id="okSauve">💾 Sauvegarder</button><button class="petit-bouton neutre" id="okRestaure">📂 Restaurer</button><input type="file" id="fichierRestaure" accept=".json,application/json" hidden></div>' +
      '<div class="rangee"><label>Effacer tous les progrès de ce téléphone</label><button class="petit-bouton danger" id="effacer">Effacer</button></div>' +
      '<div id="confirme" hidden class="rangee"><label><strong>Sûr ? Étoiles, pièces, album et historique seront perdus.</strong></label><button class="petit-bouton neutre" id="non">Annuler</button><button class="petit-bouton danger" id="oui">Oui, effacer</button></div>' +
      "</div>" + (E.code === "1234" ? '<p class="note">Le code est encore 1234. Change-le pour que les enfants ne puissent pas entrer ici.</p>' : "") +
      '<p class="discret">' + esc(C.titreAppli) + " · " + esc(C.version) + "</p></div>";
    $ecran.scrollTop = 0;
    document.getElementById("retour").onclick = carte;
    $ecran.querySelectorAll("[data-bon]").forEach(b => b.onclick = () => {
      const [i, act] = b.dataset.bon.split(":"); const bon = E.bons[+i];
      if (act === "ok") { bon.statut = "accorde"; bon.vu = false; } else { bon.statut = "refuse"; E.pieces += bon.prix; }
      sauver(); parent(act === "ok" ? "Récompense accordée. " + prenom() + " verra la bonne nouvelle." : "Récompense refusée, les pièces sont rendues.");
    });
    $ecran.querySelectorAll("[data-suppr]").forEach(b => b.onclick = () => { const c = catalogue().slice(); c.splice(+b.dataset.suppr, 1); E.catalogue = c; sauver(); parent("Récompense retirée."); });
    const ajout = document.getElementById("okBon");
    if (ajout) ajout.onclick = () => { const nom = document.getElementById("champBon").value.trim(), prix = parseInt(document.getElementById("champPrix").value, 10); if (!nom || !(prix > 0)) return parent("Indique un nom et un prix en pièces."); E.catalogue = catalogue().concat([["🎁", nom, prix]]); sauver(); parent("Récompense ajoutée : " + nom); };
    $ecran.querySelectorAll("[data-bul]").forEach(b => b.onclick = () => bulletin(E.bulletins[+b.dataset.bul], true));
    document.getElementById("partagerResume").onclick = partagerResume;
    const of = document.getElementById("okFamille");
    if (of) of.onclick = () => { const c = window.Synchro.normaliser(document.getElementById("champFamille").value); if (!window.Synchro.valide(c)) return parent("Le code doit ressembler à ABCD-EFGH-JKLM."); E.famille = c; sauver(); demarrerSync(); parent("Téléphone relié ! Papa verra les progrès de " + prenom() + "."); };
    const dl = document.getElementById("delier"); if (dl) dl.onclick = () => { E.famille = ""; sauver(); parent("Téléphone délié."); };
    document.getElementById("okPrenom").onclick = () => { const v = document.getElementById("champPrenom").value.trim(); if (v) { E.prenom = v; sauver(); parent("Prénom enregistré."); } };
    document.getElementById("okCode").onclick = () => { const v = document.getElementById("champCode").value.trim(); if (/^\d{4}$/.test(v)) { E.code = v; sauver(); parent("Nouveau code enregistré. Retiens-le bien."); } else parent("Le code doit faire exactement 4 chiffres."); };
    document.getElementById("okOuvert").onclick = () => { E.toutOuvert = !E.toutOuvert; sauver(); parent(E.toutOuvert ? "Toutes les étapes sont ouvertes." : "Les étapes s'ouvrent à nouveau dans l'ordre."); };
    document.getElementById("okPieces").onclick = () => { const v = parseInt(document.getElementById("champPieces").value, 10); if (v > 0 && v <= 500) { E.pieces += v; sauver(); parent(v + " pièces données."); } else parent("Indique un nombre de pièces entre 1 et 500."); };
    document.getElementById("okAnniv").onclick = () => { const v = document.getElementById("champAnniv").value; E.anniv = v ? v.slice(5) : ""; E.annivFete = ""; sauver(); parent(v ? "Anniversaire enregistré : le " + new Date(v + "T12:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) + "." : "Anniversaire effacé."); };
    document.getElementById("okSoir").onclick = () => { E.reglages.soir = { auto: "oui", oui: "non", non: "auto" }[E.reglages.soir]; sauver(); appliquerAffichage(); parent("Mode du soir modifié."); };
    document.getElementById("okTaille").onclick = () => { E.reglages.taille = (E.reglages.taille + 1) % 3; sauver(); appliquerAffichage(); parent("Taille du texte modifiée."); };
    document.getElementById("okPolice").onclick = () => { E.reglages.police = !E.reglages.police; sauver(); appliquerAffichage(); parent("Police modifiée."); };
    document.getElementById("okSauve").onclick = sauvegarder;
    document.getElementById("okRestaure").onclick = () => document.getElementById("fichierRestaure").click();
    document.getElementById("fichierRestaure").onchange = e => { if (e.target.files[0]) restaurer(e.target.files[0]); };
    document.getElementById("effacer").onclick = () => { document.getElementById("confirme").hidden = false; };
    document.getElementById("non").onclick = () => { document.getElementById("confirme").hidden = true; };
    document.getElementById("oui").onclick = () => { const garde = { prenom: E.prenom, code: E.code, anniv: E.anniv, reglages: E.reglages }; E = Object.assign(defaut(), garde); sauver(); parent("Progrès effacés."); };
  }

  function donneesSemaine() {
    const ilya7 = Date.now() - 7 * 864e5;
    const parties = E.journal.filter(j => new Date(j.date).getTime() >= ilya7);
    const min = Object.entries(E.jours).filter(([j]) => new Date(j + "T12:00").getTime() >= ilya7).reduce((s, [, v]) => s + v, 0) / 60;
    const parLecon = {};
    parties.forEach(j => { if (j.ratio == null) return; (parLecon[j.id] = parLecon[j.id] || []).push(j.ratio); });
    const tous = TOUS_NIVEAUX.concat(BOSSES);
    const nom = id => { const n = tous.find(x => x.id === id); return n ? n.titre : null; };
    const moy = a => a.reduce((s, x) => s + x, 0) / a.length;
    const acquis = Object.keys(parLecon).filter(id => moy(parLecon[id]) >= 0.85).map(nom).filter(Boolean);
    const coince = Object.keys(parLecon).filter(id => moy(parLecon[id]) < 0.65).map(nom).filter(Boolean);
    const compte = {}; E.erreurs.forEach(x => compte[x.id] = (compte[x.id] || 0) + 1);
    const reprendre = Object.entries(compte).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, k]) => { const n = tous.find(x => x.id === id); return n ? esc(n.titre) + (n.objectif ? " (" + esc(n.objectif) + ")" : "") + " · " + k + " erreur" + (k > 1 ? "s" : "") + " à revoir" : null; }).filter(Boolean);
    const joursJoues = Object.keys(E.jours).filter(j => new Date(j + "T12:00").getTime() >= ilya7).length;
    const points = Math.round(parties.reduce((s, j) => s + (j.ratio || 0) * 10, 0) + joursJoues * 5);
    return { parties: parties.length, min: Math.round(min), acquis, coince, reprendre, points, joursJoues };
  }
  function resumeSemaine() {
    const { parties, min, acquis, coince, reprendre } = donneesSemaine();
    const liste = a => a.length ? a.map(x => "<li>" + x + "</li>").join("") : '<li class="note">Rien pour l\'instant</li>';
    return "<h2>La semaine de " + esc(prenom()) + '</h2><div class="bloc"><div class="stat"><div><b>' + parties + "</b><span>parties</span></div><div><b>" + min + " min</b><span>de jeu</span></div><div><b>" + E.serie.n + "</b><span>jours de suite</span></div></div>" +
      '<div class="resume"><strong>✅ Acquis</strong><ul>' + liste(acquis.map(esc)) + "</ul><strong>⚠️ Ça coince</strong><ul>" + liste(coince.map(esc)) + "</ul><strong>📌 À reprendre avec " + esc(prenom()) + "</strong><ul>" + liste(reprendre) + "</ul></div><button class=\"petit-bouton\" id=\"partagerResume\">📤 Envoyer ce résumé à papa (WhatsApp)</button></div>";
  }
  // Résumé en texte simple, envoyé par WhatsApp (ou un autre moyen de partage du téléphone).
  function partagerResume() {
    const { parties, min, acquis, coince, reprendre } = donneesSemaine();
    const texte = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };
    const liste = a => a.length ? a.map(x => "• " + texte(x)).join("\n") : "• rien pour l'instant";
    const att = E.bons.filter(b => b.statut === "attente");
    const msg = "📚 La semaine de " + prenom() + " (" + C.classe + ")\n" + parties + " parties · " + min + " min de jeu · 🔥 " + E.serie.n + " jours de suite · ⭐ " + totalEtoiles() + " étoiles\n\n✅ Acquis\n" + liste(acquis) + "\n\n⚠️ Ça coince\n" + liste(coince) + "\n\n📌 À reprendre ensemble\n" + liste(reprendre) +
      (att.length ? "\n\n🎁 Récompenses demandées\n" + att.map(b => "• " + b.e + " " + b.nom + " (" + b.prix + " pièces)").join("\n") : "") +
      (E.bulletins[0] ? "\n\n📝 Dernière composition : " + E.bulletins[0].moyenne + "/10 · " + E.bulletins[0].mention : "");
    if (navigator.share) navigator.share({ text: msg }).catch(() => {});
    else window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
  }
  function bonsParent() {
    const att = E.bons.map((b, i) => [b, i]).filter(([b]) => b.statut === "attente");
    return '<h2>Récompenses demandées</h2><div class="bloc">' + (att.length ? "<table>" + att.map(([b, i]) => "<tr><td>" + b.e + " " + esc(b.nom) + '<br><span class="note">' + b.prix + " pièces · " + new Date(b.date).toLocaleDateString("fr-FR") + '</span></td><td><button class="petit-bouton" data-bon="' + i + ':ok">Accepter</button> <button class="petit-bouton neutre" data-bon="' + i + ':non">Refuser</button></td></tr>').join("") + "</table>" : '<p class="note">Aucune demande en attente.</p>') +
      '<details><summary>Modifier la liste des récompenses</summary><table>' + catalogue().map(([e, nom, prix], i) => "<tr><td>" + e + " " + esc(nom) + "</td><td>" + prix + ' 🪙 <button class="petit-bouton neutre" data-suppr="' + i + '">Retirer</button></td></tr>').join("") + "</table>" +
      '<div class="rangee"><input type="text" id="champBon" placeholder="Nouvelle récompense" style="flex:1;min-width:140px"><input type="text" id="champPrix" inputmode="numeric" placeholder="Prix" style="width:70px"><button class="petit-bouton" id="okBon">Ajouter</button></div></details></div>';
  }

  // ----- Synchronisation avec l'appli Papa -----
  let base = null;
  async function demarrerSync() {
    if (!E.famille || !window.Synchro) return;
    base = await window.Synchro.demarrer();
    if (!base) return;
    base.doc("familles/" + E.famille + "/reglages/" + C.id).onSnapshot(d => appliquerReglages(d.data() || {}), () => {});
    envoyer();
  }
  function envoyer() {
    if (!base || !E.famille) return;
    const tous = TOUS_NIVEAUX.concat(BOSSES);
    const nomDe = id => { const n = tous.find(x => x.id === id); return n ? n.titre : id; };
    const etat = {
      prenom: prenom(), classe: C.classe, titre: C.titreAppli, avatar: C.avatar, couleur: getComputedStyle(document.documentElement).getPropertyValue("--theme").trim(),
      maj: Date.now(), pieces: E.pieces, serie: serieActive(), etoiles: totalEtoiles(), faites: tous.filter(n => etoilesDe(n) > 0).length, total: tous.length,
      semaine: donneesSemaine(), toutOuvert: E.toutOuvert, code: E.code === "1234" ? "1234" : "modifié",
      matieres: C.mondes.map(m => ({ titre: m.titre, icone: m.icone, lecons: TOUS_NIVEAUX.filter(n => n.monde === m).map(n => ({ titre: n.titre, objectif: n.objectif || "", etoiles: etoilesDe(n), dernier: (E.progres[n.id] || {}).dernier || "" })) })),
      journal: E.journal.slice(0, 25).map(j => ({ titre: nomDe(j.id), score: j.score, date: j.date })),
      jours: E.jours, bulletins: E.bulletins.slice(0, 6), bons: E.bons.slice(0, 15), catalogue: catalogue(),
    };
    base.doc("familles/" + E.famille + "/enfants/" + C.id).set(etat).catch(() => {});
  }
  function appliquerReglages(r) {
    let change = false;
    Object.entries(r.decisions || {}).forEach(([date, dec]) => {
      const b = E.bons.find(x => x.date === date && x.statut === "attente");
      if (!b) return;
      if (dec === "accorde") { b.statut = "accorde"; b.vu = false; } else { b.statut = "refuse"; E.pieces += b.prix; }
      change = true;
    });
    (r.cadeaux || []).forEach(c => { if (E.recus.includes(c.id)) return; E.recus.push(c.id); E.pieces += c.n; change = true; setTimeout(() => { bravo("🎁 +" + c.n + " pièces de papa !"); son("piece"); }, 600); });
    if (typeof r.toutOuvert === "boolean" && r.toutOuvert !== E.toutOuvert) { E.toutOuvert = r.toutOuvert; change = true; }
    if (r.prenom && r.prenom !== E.prenom) { E.prenom = r.prenom; change = true; }
    if (Array.isArray(r.catalogue) && JSON.stringify(r.catalogue) !== JSON.stringify(E.catalogue)) { E.catalogue = r.catalogue; change = true; }
    if (change) { sauver(); if (document.getElementById("voyage")) carte(); }
  }
  async function honneur() {
    changer();
    $ecran.className = "ecran";
    $ecran.innerHTML = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>Tableau d\'honneur</h1></div><p class="aide">Chargement…</p>';
    document.getElementById("retour").onclick = carte;
    let enfants = [];
    try { const q = await base.collection("familles/" + E.famille + "/enfants").get(); enfants = q.docs.map(d => d.data()); } catch (e) {}
    if (!enfants.length) { $ecran.querySelector(".aide").textContent = "Pas de connexion pour l'instant. Réessaie avec internet."; return; }
    enfants.sort((a, b) => (b.semaine ? b.semaine.points : 0) - (a.semaine ? a.semaine.points : 0));
    const medailles = ["🥇", "🥈", "🥉"];
    $ecran.innerHTML = '<div class="titre-page"><button class="rond" id="retour" aria-label="Retour">←</button><h1>Tableau d\'honneur</h1></div>' +
      '<p class="aide">Les points de la semaine : 10 par partie parfaite et 5 par jour joué. Chacun joue à son niveau, donc c\'est juste !</p><div class="bons">' +
      enfants.map((x, i) => '<div class="bon-ligne demande' + (x.prenom === prenom() ? " moi-h" : "") + '"><b>' + (medailles[i] || "⭐") + '</b><span><strong>' + esc(x.prenom) + "</strong> · " + esc(x.classe) + "<br><small>" + (x.semaine ? x.semaine.parties : 0) + " parties · 🔥 " + (x.serie || 0) + '</small></span><span class="prix">' + (x.semaine ? x.semaine.points : 0) + " pts</span></div>").join("") + "</div>";
    document.getElementById("retour").onclick = carte;
    dire(enfants[0].prenom + " est en tête cette semaine !");
  }

  window.addEventListener("resize", () => { if (document.getElementById("voyage")) carte(); });
  appliquerAffichage();
  carte();
  demarrerSync();
})();
</script>
